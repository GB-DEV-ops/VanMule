<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VanMule overlay</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Compact always-on-top controller: header, two big toggles, voice tiles, routing with meters */
:root{
  --bg:#141110; --panel:#1d1916; --panel2:#272220; --line:#352e29; --fg:#f3ece5; --muted:#a3968a; --dim:#6f655c;
  --ember:#ff8a3d; --ember-ink:#1b0d03; --gold:#ffc861; --ok:#4ade80; --bad:#ff5a52; --cool:#6fd3c7;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Figtree",system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:0;user-select:none}
button,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{-webkit-app-region:drag;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:28px;height:28px;flex:none;display:block}
.title{flex:1;min-width:0}
.title b{display:block;font-weight:700;font-size:13px}
.title span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{-webkit-app-region:no-drag;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.hb:hover{background:var(--panel2);color:var(--fg)}
main{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.tg .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.tg b{display:block;font-size:13px}
.tg small{display:block;color:var(--muted);font-size:11px}
.tg[aria-pressed="true"]{border-color:var(--ember)}
.tg[aria-pressed="true"] .dot{background:var(--ember);color:var(--ember-ink)}
.tg.hear[aria-pressed="true"]{border-color:var(--cool)}
.tg.hear[aria-pressed="true"] .dot{background:var(--cool);color:#062320}
.hv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.hv .ico{color:var(--cool)}
.hv.off{opacity:.55}
.hv b{font-size:12px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.vrange{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cool) var(--p,50%),var(--panel2) 0);outline:none;cursor:pointer;margin:0}
.vrange::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--fg);border:3px solid var(--cool)}
.recrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.recb{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;min-width:0}
.recb .rd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);flex:none}
.recb .rd i{width:14px;height:14px;border-radius:50%;background:var(--bad);display:block;transition:border-radius .2s}
.recb b{display:block;font-size:13px}
.recb small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recb.on{border-color:var(--bad);background:linear-gradient(90deg,rgba(255,90,82,.16),transparent),var(--panel)}
.recb.on .rd{background:var(--bad)} .recb.on .rd i{background:#fff;border-radius:2px;width:12px;height:12px}
.recb.on b{font-variant-numeric:tabular-nums}
.recb.on.paused{border-color:var(--gold)} .recb.on.paused .rd{background:var(--gold)}
.pz{width:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.pz:hover{color:var(--fg)}
.blink{animation:bl 1.2s ease-in-out infinite} @keyframes bl{50%{opacity:.3}}
.lbl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.voices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:0}
.vt:hover{border-color:var(--muted)}
.vt[aria-pressed="true"]{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.vt .av{width:46px;height:46px;display:block}
.vt img.av{border-radius:50%;object-fit:cover;background:var(--panel2)}
.vt span{font-size:11.5px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{color:var(--muted);font-size:12px;margin:0}
.route{display:grid;gap:6px}
.route .row{display:flex;align-items:center;gap:8px}
.route .ico{color:var(--ember)}
select{flex:1;min-width:0;height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);padding:0 8px;font-size:12px}
.meter{height:6px;display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-left:26px}
.meter i{border-radius:1px;background:var(--panel2)}
.meter i.on{background:var(--ok)} .meter i.on.hot{background:var(--gold)} .meter i.on.clip{background:var(--bad)}
.start{display:flex;gap:8px;align-items:center;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--gold)}
.start p{margin:0;flex:1;font-size:12px;color:var(--muted)}
.btn{height:30px;padding:0 12px;border-radius:8px;font-weight:700;background:var(--ember);color:var(--ember-ink);white-space:nowrap}
.wait{flex:1;display:grid;place-items:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sec{display:flex;flex-direction:column;gap:8px}
button.lbl{background:none;border:0;padding:4px 0;cursor:pointer;width:100%;color:var(--dim);font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
button.lbl:hover{color:var(--fg)}
.lbl .chev{display:inline-block;font-style:normal;margin-right:6px;transition:transform .15s}
.sec.shut .chev{transform:rotate(-90deg)}.sec.shut .secb{display:none}
.secb{display:flex;flex-direction:column;gap:8px}
.lbl .k{letter-spacing:0;text-transform:none;font-family:ui-monospace,Consolas,monospace}
.rmode{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.rmode button{height:26px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);background:none}
.rmode button[aria-pressed="true"]{background:var(--ember);color:var(--ember-ink)}
.rmode button:disabled{opacity:.5;cursor:not-allowed}
.keyhint{text-align:center;margin-top:2px}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.scores{display:flex;flex-direction:column;gap:4px}
.sc{display:grid;grid-template-columns:38px 24px 10px 24px 38px 1fr;align-items:center;gap:4px;font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.sc.live{border-color:color-mix(in srgb,#ff5a52 60%,transparent)}.sc .t{font-weight:800}.sc b{text-align:center;font-size:14px}.sc .at{color:var(--dim);text-align:center}.sc small{color:var(--muted);text-align:right;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .k.live{color:#ff5a52;font-family:inherit;letter-spacing:.08em}
.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.qsb{padding:7px 5px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qsb:hover{border-color:var(--ember)}.qsb.on{background:var(--ember);color:var(--ember-ink);border-color:var(--ember)}
.qstop{width:100%;margin-top:6px;padding:6px;border-radius:8px;border:1px solid var(--line);color:var(--bad);font-size:12px;font-weight:700}.qstop:hover{background:var(--bad);color:#fff}
.qm{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.qmb{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted)}
.qmb img{width:100%;height:100%;object-fit:cover}.qmb:hover{border-color:var(--ember)}.qmb.copied{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.rpb{width:100%;margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid var(--ember);color:var(--ember);font-weight:700;text-align:left}.rpb small{color:var(--muted);font-weight:500;margin-left:6px}.rpb:hover{background:var(--ember);color:var(--ember-ink)}
.chrow{display:flex;gap:6px;margin-top:8px}.chb{flex:1;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);text-align:left;font-size:12.5px;min-width:0}.chb small{color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}.chb.on{border-color:#22e06b;color:#22e06b}.chn{width:34px;border-radius:10px;border:1px solid var(--line);font-size:18px}
.fl{display:flex;flex-direction:column;gap:6px}.fl+.fl{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.flh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}.flh span{font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}.ft{display:flex;flex-direction:column;min-width:0}.ft:last-child{text-align:right}
.ft b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ft em{font-style:normal;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}.ft small{font-size:10.5px;color:var(--muted)}
.fm.up .me em{color:var(--ok)}.fm.down .me em{color:var(--bad)}.fv{font-size:11px;color:var(--muted)}
.fp{display:flex;flex-direction:column;gap:2px}.fpr{display:grid;grid-template-columns:30px 1fr auto 34px;gap:6px;font-size:11.5px;align-items:center}.fpos{color:var(--muted);font-weight:700}.fpn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fps{color:var(--muted);font-size:10.5px;white-space:nowrap}.fpr b{text-align:right;font-variant-numeric:tabular-nums}.fpr.live .fps{color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:6px}.fbr{display:grid;grid-template-columns:1fr 34px 10px 34px 1fr;gap:4px;font-size:11px;align-items:center}.fbr span:last-child{text-align:right}.fbr b{text-align:center;font-variant-numeric:tabular-nums}.fbr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhint{color:var(--muted);font-size:12px;margin:0}
</style>
</head>
<body>
<header>
  <svg class="logo" role="img" aria-label="VanMule" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs> <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a4d"/><stop offset=".55" stop-color="#f26a1f"/><stop offset="1" stop-color="#c2410c"/></linearGradient> <radialGradient id="ogl" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient> <clipPath id="oclip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath> </defs> <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#obg)"/> <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#ogl)"/> <g clip-path="url(#oclip)" fill="#1b0d03"> <path d="M156 196 C136 150 130 96 146 52 C178 88 198 142 200 194 Z"/> <path d="M206 186 C204 130 220 78 250 44 C268 92 264 148 244 192 Z"/> <path d="M84 520 C88 424 102 336 124 270 C136 232 148 206 166 192 C196 170 238 170 266 186 C298 204 324 238 344 272 C356 292 370 308 370 328 C370 350 352 362 328 362 C306 362 288 356 272 348 C256 356 240 360 224 360 C222 404 228 462 242 520 Z"/> </g> <path d="M166 184 C154 150 151 114 157 84 C172 110 182 144 185 178 Z" fill="#ff8a3d" opacity=".22"/> <path d="M216 178 C216 138 224 102 241 76 C248 110 245 146 233 180 Z" fill="#ff8a3d" opacity=".22"/> <circle cx="236" cy="234" r="13" fill="#ff8a3d"/><circle cx="240" cy="230" r="4" fill="#fff" opacity=".8"/> <ellipse cx="348" cy="322" rx="8" ry="6" fill="#ff8a3d"/> <path d="M300 342 q14 5 28 0" fill="none" stroke="#ff8a3d" stroke-width="6" stroke-linecap="round"/> <rect x="408" y="206" width="48" height="96" rx="24" fill="#1b0d03"/> <g stroke="#ff8a3d" stroke-width="5" stroke-linecap="round" opacity=".5"><path d="M420 236 h24 M420 252 h24 M420 268 h24"/></g> <g fill="none" stroke="#1b0d03" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"> <path d="M394 268 v14 a38 38 0 0 0 76 0 v-14"/> <path d="M432 322 v50 M404 374 h56"/> </g></svg>
  <div class="title"><b>VanMule</b><span id="cur">Connecting…</span></div>
  <button class="hb" id="openMain" title="Open the full app" aria-label="Open the full app"><svg class="ico" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
  <button class="hb" id="close" title="Close overlay" aria-label="Close overlay"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</header>
<main id="main"><div class="wait">Waiting for VanMule…</div></main>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = {
  power: '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  ear: '<path d="M6 8.5a6 6 0 1 1 12 0c0 6-6 6-6 10a3 3 0 0 1-6 0"/><path d="M15 8.5a3 3 0 1 0-6 0"/>',
  mic: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  out: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  play: '<path d="M7 4v16l13-8z" fill="currentColor"/>', pause: '<path d="M8 5v14M16 5v14"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
const ico = (n) => `<svg class="ico" viewBox="0 0 24 24">${I[n]}</svg>`;
let st = null, dragging = false, recBase = 0, recAt = 0, vmBase = 0, vmAt = 0;
const vmElapsed = () => !st || !st.vmsg || !st.vmsg.on ? 0 : vmBase + (Date.now() - vmAt);
setInterval(() => { const el = document.getElementById('vmT'); if (el && st && st.vmsg && st.vmsg.on) el.textContent = fmt(vmElapsed()); }, 250);
const fmt = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const recElapsed = () => !st || !st.rec || !st.rec.on ? 0 : st.rec.paused ? recBase : recBase + (Date.now() - recAt);
setInterval(() => { const el = document.getElementById('recT'); if (el && st && st.rec && st.rec.on && !st.rec.paused) el.textContent = fmt(recElapsed()); }, 500);
document.addEventListener('pointerdown', (e) => { if (e.target.type === 'range') dragging = true; });
document.addEventListener('pointerup', () => { if (dragging) { dragging = false; render(); } });
const send = (c) => window.ov && window.ov.cmd(c);
/* fantasy scoreboard markup shared by the mini overlay and the fantasy overlay window */
function fanHtml(F, mode) {
  if (!F || !F.leagues || !F.leagues.length) return '<p class="fhint">No fantasy matchups yet.</p>';
  const n = (v) => v == null || v === '' ? '—' : (Math.round(+v * 10) / 10).toFixed(1).replace(/\.0$/, '');
  return F.leagues.map((L) => {
    const me = L.me || {}, op = L.opp || {}, mp = +me.pts || 0, opp = +op.pts || 0, lead = L.opp ? (mp > opp ? 'up' : mp < opp ? 'down' : '') : '';
    let h = `<div class="fl"><div class="flh"><span>${esc(L.league)}</span><small>${esc(L.source)} · Wk ${esc(L.week)}</small></div>
      <div class="fm ${lead}"><div class="ft me"><b>${esc(me.name || 'You')}</b><em>${n(me.pts)}</em>${me.proj ? `<small>proj ${n(me.proj)}</small>` : ''}</div><span class="fv">vs</span><div class="ft"><b>${esc(L.opp ? op.name : 'Bye')}</b><em>${L.opp ? n(op.pts) : ''}</em>${op.proj ? `<small>proj ${n(op.proj)}</small>` : ''}</div></div>`;
    if (mode !== 'simple' && me.players && me.players.length) h += `<div class="fp">${me.players.slice(0, 10).map((p) => `<div class="fpr ${p.live ? 'live' : ''}"><span class="fpos">${esc(p.pos)}</span><span class="fpn">${esc(p.name)}</span><span class="fps">${esc(p.st || '')}</span><b>${n(p.pts)}</b></div>`).join('')}</div>`;
    if (mode === 'full' && L.board && L.board.length > 1) h += `<div class="fb">${L.board.filter((m) => !m.mine).map((m) => `<div class="fbr"><span>${esc(m.a.name)}</span><b>${n(m.a.pts)}</b><span class="fv">–</span><b>${m.b ? n(m.b.pts) : ''}</b><span>${m.b ? esc(m.b.name) : 'Bye'}</span></div>`).join('')}</div>`;
    return h + '</div>';
  }).join('');
}

function meter(id) { return `<div class="meter" id="${id}">${'<i></i>'.repeat(30)}</div>`; }
function opts(list, sel, def) {
  return `<option value="">${def}</option>` + list.map((d) => `<option value="${esc(d.id)}" ${d.id === sel ? 'selected' : ''}>${esc(d.label)}</option>`).join('');
}
let collapsed = {}; try { collapsed = JSON.parse(localStorage.getItem('ovCollapsed') || '{}'); } catch {}
const sec = (k, title, extra, body) => `<section class="sec ${collapsed[k] ? 'shut' : ''}"><button class="lbl" data-sec="${k}" aria-expanded="${!collapsed[k]}"><span><i class="chev">▾</i>${title}</span>${extra || ''}</button><div class="secb">${body}</div></section>`;
function render() {
  if (!st) return;
  if (st.theme) for (const [k, v] of Object.entries(st.theme)) if (v) document.documentElement.style.setProperty('--' + k, v);
  $('#cur').textContent = (st.vcOn ? st.voiceName : 'Voice changer off') + (st.input === 'live' ? (st.muted ? ' · mic muted' : '') : ' · mic off');
  const live = st.input === 'live';
  $('#main').innerHTML = `
    ${live ? '' : `<div class="start"><p>The microphone is off.</p><button class="btn" data-c="mic">Start mic</button></div>`}
    ${sec('voice', 'Voice', '', `<div class="toggles">
      <button class="tg" data-c="vc" aria-pressed="${st.vcOn}"><span class="dot">${ico('power')}</span><span><b>Voice</b><small>${st.vcOn ? 'On' : 'Off'}</small></span></button>
      <button class="tg hear" data-c="hear" aria-pressed="${st.hear}"><span class="dot">${ico('ear')}</span><span><b>Hear back</b><small>${st.hear ? 'On' : 'Off'}</small></span></button>
    </div>
    ${st.ch ? `<div class="chrow"><button class="chb ${st.ch.on ? 'on' : ''}" data-c="chToggle" aria-pressed="${!!st.ch.on}">⌖ Crosshair <b>${st.ch.on ? 'On' : 'Off'}</b>${st.ch.name ? `<small>${esc(st.ch.name)}</small>` : ''}</button><button class="chn" data-c="chNext" title="Next crosshair" aria-label="Next crosshair">›</button></div>` : ''}
    <div class="hv ${st.hear ? '' : 'off'}" title="How loud you hear your own voice">${ico('ear')}<input type="range" class="vrange" id="hearVol" min="0" max="100" value="${st.hearVol}" style="--p:${st.hearVol}%" aria-label="Hear back volume"><b id="hearVolV">${st.hearVol}%</b></div>`)}
    ${sec('rec', 'Record', st.rec && st.rec.key ? `<span class="k">${esc(st.rec.key)}</span>` : '', `
    <div class="rmode" role="group" aria-label="What to record">${[['video', 'Video'], ['audio', 'Audio'], ['voice', 'Voice only']].map(([k, n]) => `<button data-mode="${k}" aria-pressed="${st.rec && st.rec.mode === k}" ${st.rec && (st.rec.on || st.rec.starting) ? 'disabled' : ''} title="${k === 'video' ? 'Screen, game sound and your voice' : k === 'audio' ? 'Game sound and your voice, no video' : 'Just your (changed) voice'}">${n}</button>`).join('')}</div>
    <div class="recrow">
      <button class="recb ${st.rec && st.rec.on ? 'on' : ''} ${st.rec && st.rec.paused ? 'paused' : ''}" data-c="cap" aria-pressed="${!!(st.rec && st.rec.on)}"><span class="rd"><i></i></span><span style="min-width:0"><b id="recT">${st.rec && st.rec.on ? (st.rec.paused ? 'Paused · ' : '') + fmt(recElapsed()) : st.rec && st.rec.starting ? 'Starting…' : 'Start recording'}</b><small>${st.rec && st.rec.on ? 'Click to stop and save' : st.rec ? (st.rec.video ? 'Video · ' + esc(st.rec.q) : 'Audio only') : ''}</small></span></button>
      ${st.rec && st.rec.on ? `<button class="pz" data-c="capPause" title="${st.rec.paused ? 'Resume' : 'Pause'}" aria-label="${st.rec.paused ? 'Resume recording' : 'Pause recording'}">${st.rec.paused ? ico('play') : ico('pause')}</button>` : `<button class="pz" data-c="capView" title="Recording settings" aria-label="Recording settings">${ico('gear')}</button>`}
    </div>
    ${st.rec && st.rec.replay && st.rec.replay.on ? `<button class="rpb" data-c="replay" title="Save the last ${st.rec.replay.len} seconds">⟲ Save replay <small>last ${st.rec.replay.len}s${st.rec.replay.key ? ' · ' + esc(st.rec.replay.key) : ''}</small></button>` : ''}
    <button class="recb vm ${st.vmsg && st.vmsg.on ? 'on' : ''}" data-c="vmsg"><span class="rd" style="${st.vmsg && st.vmsg.on ? '' : 'background:#5865f2;color:#fff'}">${st.vmsg && st.vmsg.on ? '<i></i>' : ico('mic')}</span><span style="min-width:0"><b id="vmT">${st.vmsg && st.vmsg.on ? fmt(vmElapsed()) : st.vmsg && st.vmsg.busy ? 'Saving…' : 'Voice message'}</b><small>${st.vmsg && st.vmsg.on ? 'Click to stop and copy' : 'Record, then Ctrl+V in Discord' + (st.vmsg && st.vmsg.key ? ' · ' + esc(st.vmsg.key) : '')}</small></span></button>`)}
    ${sec('voices', 'Voices', '', `<div class="voices">${st.voices.map((v) => `<button class="vt" data-voice="${esc(v.id)}" aria-pressed="${st.vcOn && v.id === st.voiceId}" title="${esc(v.name)}">${v.html}<span>${esc(v.name)}</span></button>`).join('')}</div>
    ${st.voices.length < 2 ? '<p class="hint">Star voices in the full app to add them here.</p>' : ''}`)}
    ${st.quick ? sec('quick', 'Quick sounds & memes', '', `${st.quick.sounds.length ? `<div class="qs">${st.quick.sounds.map((x) => `<button class="qsb ${(st.quick.playing || []).includes(x.id) ? 'on' : ''}" data-snd="${esc(x.id)}" title="Play ${esc(x.name)}">${esc(x.name)}</button>`).join('')}</div><button class="qstop" data-c="stopAll">■ Stop all sounds</button>` : '<p class="hint">Star sounds in the Soundboard to put them here.</p>'}
      ${st.quick.memes && st.quick.memes.length ? `<div class="qm">${st.quick.memes.map((m) => `<button class="qmb" data-meme="${esc(m.file)}" title="Copy ${esc(m.file)}">${m.thumb ? `<img src="${m.thumb}" alt="">` : '<span>GIF</span>'}</button>`).join('')}</div><p class="hint">Click a meme to copy it, then press Ctrl+V in Discord.</p>` : ''}`) : ''}
    ${st.fan && st.fan.mode && st.fan.mode !== 'off' && st.fan.data && st.fan.data.leagues && st.fan.data.leagues.length ? sec('fantasy', 'Fantasy', '', fanHtml(st.fan.data, st.fan.mode)) : ''}
    ${st.scores && st.scores.length ? sec('scores', 'Scores', st.scores.some((g) => g.live) ? '<span class="k live">● LIVE</span>' : '', `<div class="scores">${st.scores.map((g) => `<div class="sc ${g.live ? 'live' : ''}"><span class="t">${esc(g.a)}</span><b>${g.live || g.fin ? esc(g.as) : ''}</b><span class="at">${g.live || g.fin ? '–' : '@'}</span><b>${g.live || g.fin ? esc(g.hs) : ''}</b><span class="t">${esc(g.h)}</span><small>${g.fin ? 'Final' : esc(g.detail)}${!g.fin && g.odds ? ' · ' + esc(g.odds) : ''}</small></div>`).join('')}</div>`) : ''}
    ${sec('route', 'Routing', '', `<div class="route">
      <div class="row" title="Where your voice comes from">${ico('mic')}<select id="devIn" aria-label="Microphone">${opts(st.ins, st.devIn, 'Default microphone')}</select></div>
      ${meter('mIn')}
      <div class="row" title="Where your changed voice goes">${ico('out')}<select id="devOut" aria-label="Send voice to" ${st.sinkOk ? '' : 'disabled'}>${opts(st.outs, st.devOut, 'Default output')}</select></div>
      ${meter('mOut')}
    </div>`)}
    ${st.ovKey ? `<p class="hint keyhint">Press <kbd>${esc(st.ovKey)}</kbd> anywhere to show or hide this overlay.</p>` : `<p class="hint keyhint">Tip: set a shortcut for this overlay in VanMule → Settings → Shortcuts.</p>`}`;
  const hv = $('#hearVol'); if (!hv) return;
  hv.oninput = () => { hv.style.setProperty('--p', hv.value + '%'); $('#hearVolV').textContent = hv.value + '%'; send({ t: 'hearVol', v: +hv.value }); };
  if ($('#devIn')) $('#devIn').onchange = (e) => send({ t: 'devIn', id: e.target.value });
  if ($('#devOut')) $('#devOut').onchange = (e) => send({ t: 'devOut', id: e.target.value });
}
function paint(id, l) {
  const m = document.getElementById(id); if (!m) return;
  const n = Math.round(l * 30), c = m.children;
  for (let i = 0; i < 30; i++) c[i].className = i < n ? (i >= 27 ? 'on clip' : i >= 22 ? 'on hot' : 'on') : '';
}
document.addEventListener('click', (e) => {
  const sc = e.target.closest('[data-sec]'); if (sc) { const k = sc.dataset.sec; collapsed[k] = !collapsed[k]; try { localStorage.setItem('ovCollapsed', JSON.stringify(collapsed)); } catch {} sc.closest('.sec').classList.toggle('shut', !!collapsed[k]); sc.setAttribute('aria-expanded', !collapsed[k]); return; }
  const md = e.target.closest('[data-mode]'); if (md) { if (!md.disabled) send({ t: 'capMode', v: md.dataset.mode }); return; }
  const v = e.target.closest('[data-voice]'); if (v) { send({ t: 'voice', id: v.dataset.voice }); return; }
  const sn = e.target.closest('[data-snd]'); if (sn) { sn.classList.add('on'); send({ t: 'sound', id: sn.dataset.snd }); return; }
  const mb = e.target.closest('[data-meme]'); if (mb) { mb.classList.add('copied'); setTimeout(() => mb.classList.remove('copied'), 900); send({ t: 'meme', file: mb.dataset.meme }); return; }
  const c = e.target.closest('[data-c]'); if (c) send({ t: c.dataset.c });
});
$('#close').onclick = () => window.ov && window.ov.close();
$('#openMain').onclick = () => window.ov && window.ov.openMain();
if (window.ov) {
  window.ov.onState((m) => {
    if (m && m.levels) { paint('mIn', m.levels.in); paint('mOut', m.levels.out); return; }
    const ae = document.activeElement, sel = ae && (ae.tagName === 'SELECT' || (ae.type === 'range' && dragging));
    st = m; if (m && m.rec) { recBase = m.rec.elapsed || 0; recAt = Date.now(); } if (m && m.vmsg) { vmBase = m.vmsg.t || 0; vmAt = Date.now(); } if (!sel) render();
  });
  send({ t: 'hello' });
}
</script>
</body>
</html>
