<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VanMule fantasy</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--panel:#1d1916;--line:#352e29;--fg:#f3ece5;--muted:#a3968a;--ok:#4ade80;--bad:#ff5a52;--ember:#ff8a3d;color-scheme:dark}
html,body{margin:0;height:100%;background:transparent;color:var(--fg);font:13px/1.3 "Figtree","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
#card{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:12px;border:1px solid var(--line);overflow:hidden}
#bg{position:absolute;inset:0;background:var(--panel);opacity:var(--op,.9);z-index:-1}
header{-webkit-app-region:drag;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
header span{flex:1}header small{font-weight:600;letter-spacing:0;text-transform:none}header button{-webkit-app-region:no-drag;background:none;border:0;color:var(--muted);width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:13px}header button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
body.locked header button{visibility:hidden}
#main{flex:1;overflow:auto;padding:4px 10px 10px;scrollbar-width:none}
.fl{display:flex;flex-direction:column;gap:6px}.fl+.fl{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.flh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}.flh span{font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}.ft{display:flex;flex-direction:column;min-width:0}.ft:last-child{text-align:right}
.ft b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ft em{font-style:normal;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}.ft small{font-size:10.5px;color:var(--muted)}
.fm.up .me em{color:var(--ok)}.fm.down .me em{color:var(--bad)}.fv{font-size:11px;color:var(--muted)}
.fp{display:flex;flex-direction:column;gap:2px}.fpr{display:grid;grid-template-columns:30px 1fr auto 34px;gap:6px;font-size:11.5px;align-items:center}.fpos{color:var(--muted);font-weight:700}.fpn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fps{color:var(--muted);font-size:10.5px;white-space:nowrap}.fpr b{text-align:right;font-variant-numeric:tabular-nums}.fpr.live .fps{color:var(--bad)}
.fb{display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:6px}.fbr{display:grid;grid-template-columns:1fr 34px 10px 34px 1fr;gap:4px;font-size:11px;align-items:center}.fbr span:last-child{text-align:right}.fbr b{text-align:center;font-variant-numeric:tabular-nums}.fbr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhint{color:var(--muted);font-size:12px;margin:0}
</style></head>
<body><div id="card"><div id="bg"></div><header><span>🏈 Fantasy</span><small id="upd"></small><button id="x" title="Close" aria-label="Close">✕</button></header><div id="main"><p class="fhint">Waiting for VanMule…</p></div></div>
<script>
"use strict";
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* fantasy scoreboard markup shared by the mini overlay and the fantasy overlay window */
function fanHtml(F, mode) {
  if (!F || !F.leagues || !F.leagues.length) return '<p class="fhint">No fantasy matchups yet.</p>';
  const n = (v) => v == null || v === '' ? '—' : (Math.round(+v * 10) / 10).toFixed(1).replace(/\.0$/, '');
  return F.leagues.map((L) => {
    const me = L.me || {}, op = L.opp || {}, mp = +me.pts || 0, opp = +op.pts || 0, lead = L.opp ? (mp > opp ? 'up' : mp < opp ? 'down' : '') : '';
    let h = `<div class="fl"><div class="flh"><span>${esc(L.league)}</span><small>${esc(L.source)} · Wk ${esc(L.week)}</small></div>
      <div class="fm ${lead}"><div class="ft me"><b>${esc(me.name || 'You')}</b><em>${n(me.pts)}</em>${me.proj ? `<small>proj ${n(me.proj)}</small>` : ''}</div><span class="fv">vs</span><div class="ft"><b>${esc(L.opp ? op.name : 'Bye')}</b><em>${L.opp ? n(op.pts) : ''}</em>${op.proj ? `<small>proj ${n(op.proj)}</small>` : ''}</div></div>`;
    if (mode !== 'simple' && me.players && me.players.length) h += `<div class="fp">${me.players.slice(0, 10).map((p) => `<div class="fpr ${p.live ? 'live' : ''}"><span class="fpos">${esc(p.pos)}</span><span class="fpn">${esc(p.name)}</span><span class="fps">${esc(p.st || '')}</span><b>${n(p.pts)}</b></div>`).join('')}</div>`;
    if (mode === 'full' && L.board && L.board.length > 1) h += `<div class="fb">${L.board.filter((m) => !m.mine).map((m) => `<div class="fbr"><span>${esc(m.a.name)}</span><b>${n(m.a.pts)}</b><span class="fv">–</span><b>${m.b ? n(m.b.pts) : ''}</b><span>${m.b ? esc(m.b.name) : 'Bye'}</span></div>`).join('')}</div>`;
    return h + '</div>';
  }).join('');
}

let st = null;
function render() { if (!st) return;
  if (st.theme) for (const [k, v] of Object.entries(st.theme)) if (v) document.documentElement.style.setProperty('--' + k, v);
  document.documentElement.style.setProperty('--op', st.opacity != null ? st.opacity : 0.9); document.body.classList.toggle('locked', !!st.lock);
  document.getElementById('main').innerHTML = fanHtml(st.fan, st.mode || 'detailed');
  document.getElementById('upd').textContent = st.fan && st.fan.at ? new Date(st.fan.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : ''; }
document.getElementById('x').onclick = () => window.ov && window.ov.cmd({ t: 'foClose' });
if (window.ov) window.ov.onState((m) => { if (m && !m.levels) { st = m; render(); } });
</script></body></html>
