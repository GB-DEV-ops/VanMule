<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>VanMule overlay for OBS</title>
<style>
/* Transparent page for an OBS Browser Source: current voice, sounds playing, live scores */
:root{--ember:#ff8a3d;--ink:#1b0d03;--fg:#fff;--panel:rgba(20,17,16,.82);--line:rgba(255,255,255,.14);--ok:#4ade80;--bad:#ff5a52}
html,body{margin:0;background:transparent;color:var(--fg);font:600 22px/1.25 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;gap:10px;padding:12px;align-items:flex-start}
body.right #wrap{align-items:flex-end}
.pill{display:inline-flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 18px 8px 8px;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .4s,transform .4s}
.pill i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:hsl(var(--h,24) 80% 50%);color:#fff;font-size:18px}
.pill small{display:block;font-size:13px;font-weight:600;opacity:.7;letter-spacing:.04em;text-transform:uppercase}
.pill.snd{padding:8px 18px;background:var(--ember);color:var(--ink);border-color:transparent}
.pill.snd b::before{content:"🔊 "}
.hide{opacity:0;transform:translateY(-6px)}
.scores{display:flex;flex-wrap:wrap;gap:8px}
.sc{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:18px}
.sc b{font-variant-numeric:tabular-nums}.sc small{font-size:13px;opacity:.75}.sc.live small{color:var(--bad);opacity:1}
</style>
</head>
<body>
<div id="wrap"></div>
<script>
"use strict";
const Q = new URLSearchParams(location.search), K = Q.get('k') || '', show = new Set((Q.get('show') || 'voice,sounds,scores').split(','));
if (Q.get('pos') === 'right') document.body.classList.add('right');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let st = null, ver = 0;
function render() {
  if (!st) return; const out = [];
  if (show.has('voice') && st.vcOn && st.input === 'live') { const v = (st.voices || []).find((x) => x.id === st.voiceId) || {}; out.push(`<div class="pill"><i style="--h:${+v.hue || 24}">${esc((st.voiceName || '?')[0])}</i><span><small>Voice</small><b>${esc(st.voiceName)}</b></span></div>`); }
  if (show.has('sounds')) for (const n of (st.playingNames || []).slice(0, 3)) out.push(`<div class="pill snd"><b>${esc(n)}</b></div>`);
  if (show.has('scores') && st.scores && st.scores.length) out.push(`<div class="scores">${st.scores.filter((g) => g.live || g.fin).slice(0, 4).map((g) => `<div class="sc ${g.live ? 'live' : ''}"><span>${esc(g.a)}</span><b>${esc(g.as)}</b><span>–</span><b>${esc(g.hs)}</b><span>${esc(g.h)}</span><small>${g.fin ? 'Final' : esc(g.detail)}</small></div>`).join('')}</div>`);
  document.getElementById('wrap').innerHTML = out.join('');
}
async function loop() {
  for (;;) {
    try { const r = await fetch('/api/state?k=' + encodeURIComponent(K) + '&v=' + ver, { cache: 'no-store' }); if (r.status === 403) { document.getElementById('wrap').innerHTML = ''; await new Promise((res) => setTimeout(res, 10000)); continue; } const j = await r.json(); ver = j.v; st = j.st; render(); }
    catch { await new Promise((res) => setTimeout(res, 3000)); }
  }
}
loop();
</script>
</body>
</html>
