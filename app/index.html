<title>VanMule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<script>if(!window.vanmule){const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap';document.head.appendChild(l);}</script>
<style>
/* Layout: icon rail | scrolling workspace | voice panel, with a floating control dock — a dark forge workbench */
:root{
  --bg:#0e0c0b; --rail:#141110; --panel:#1a1614; --panel2:#24201c; --line:#332d28;
  --fg:#f3ece5; --muted:#a3968a; --dim:#6f655c;
  --ember:#ff8a3d; --ember-ink:#1b0d03; --gold:#ffc861; --cool:#6fd3c7; --bad:#ff5a52; --ok:#4ade80;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:76px minmax(0,1fr) 340px;height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:12px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:none;color:var(--ember-ink);font-family:var(--display);font-weight:800;font-size:15px;margin-bottom:14px;letter-spacing:-.5px}
.rail-btn{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s;position:relative}
.rail-btn:hover{background:var(--panel2);color:var(--fg)}
.rail-btn.ovrail{margin-top:auto;color:var(--ember);border:1px solid color-mix(in srgb,var(--ember) 45%,transparent);background:color-mix(in srgb,var(--ember) 12%,transparent)}
.rail-btn.ovrail:hover{background:var(--ember);color:var(--ember-ink)}
.rail-btn[aria-current="page"]{background:var(--ember);color:var(--ember-ink)}
.rail-btn .tip{position:absolute;left:58px;background:var(--panel2);border:1px solid var(--line);padding:4px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;color:var(--fg)}
.rail-btn:hover .tip{opacity:1}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;color:var(--muted)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--fg);min-width:0}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(74,222,128,.18)}
.dot.file{background:var(--gold)}
.dot.err,.dot.rec{background:var(--bad)}
.dot.rec{animation:pulse 1s infinite}
.scroll{flex:1;overflow:auto;padding-block:24px 130px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

h1,h2,h3{text-wrap:balance;margin:0}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.5px}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}

.start{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--ember) 22%,transparent),transparent 55%),var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:26px}
.start .big{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ember);color:var(--ember-ink)}
.start .big .ico{width:28px;height:28px}
.start h2{font-size:18px;font-weight:700}
.start p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.start .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.start.err{background:radial-gradient(120% 140% at 0% 0%,rgba(255,90,82,.18),transparent 55%),var(--panel)}
.btn{height:40px;padding:0 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--ember);color:var(--ember-ink)}
.btn.pri:hover{background:#ff9d5c}
.btn.sec{background:var(--panel2);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--muted)}
.btn.rec{background:var(--bad);color:#1a0505}
.btn.small{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn .ico{width:18px;height:18px}
.danger{color:var(--bad)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{height:34px;padding:0 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.7}

/* Voice grid */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.vwrap{position:relative}
.vwrap[draggable=true]{cursor:grab}
.vwrap.dragging{opacity:.35}
.vwrap.drop-before::before,.vwrap.drop-after::after{content:"";position:absolute;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--ember);z-index:3}
.vwrap.drop-before::before{left:-9px}.vwrap.drop-after::after{right:-9px}
.ptools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-4px 0 16px}
.ptools .search{flex:1 1 200px;min-width:160px;max-width:none}
.ptools .search:focus-within{border-color:var(--ember)}
.ptools .search .ico{width:16px;height:16px;flex:none}
.ptools .search input{font:inherit;font-size:14px}
.ptools select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;font-size:14px;padding:8px 10px}
.ptools .count{color:var(--dim);font-size:13px}
.pempty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.vcard{width:100%;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:border-color .15s,transform .15s}
.vcard:hover{border-color:var(--muted);transform:translateY(-2px)}
.vcard[aria-pressed="true"]{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.vcard .av{width:86px;height:86px}
.logo svg.mule{width:44px;height:44px;display:block}
.pathlink{font-family:var(--mono);font-size:12.5px;color:var(--gold);text-decoration:underline;text-underline-offset:3px;text-align:left;word-break:break-all;padding:0;cursor:pointer}
.pathlink:hover{color:var(--fg)}
.avimg{border-radius:50%;object-fit:cover;background:var(--panel2);display:block}
.vwrap .more{top:8px;left:8px;background:var(--panel2);color:var(--muted)}
.vwrap:hover .more,.vwrap .more:focus-visible,.vwrap .more[aria-expanded="true"]{opacity:1}
.vcard b{font-weight:700;font-size:15px}
.vcard small{color:var(--muted);font-size:12px;line-height:1.3}
.vcard .cat{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
.kbd{font-family:var(--mono);font-size:10px;color:var(--gold);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.star{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.star:hover{color:var(--gold);background:var(--panel2)}
.star[aria-pressed="true"]{color:var(--gold)}
.star svg{width:18px;height:18px}
.star[aria-pressed="true"] svg{fill:var(--gold)}
.vcard.new{border-style:dashed;justify-content:center;color:var(--muted);min-height:200px}
.vcard.new .ico{width:34px;height:34px}

/* Soundboard */
.boards{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;overflow-y:hidden;align-items:center;scrollbar-width:thin}
.board{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.board[aria-selected="true"]{color:var(--ember);border-color:var(--ember)}
.board.add{color:var(--dim)}
.board.add:hover{color:var(--fg)}
.boardname{height:32px;border-radius:8px;background:var(--panel2);border:1px solid var(--gold);padding:0 10px;width:170px;margin-left:6px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:16px 14px}
.stile{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.tw{position:relative}
.thumb{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 70% 34%),hsl(calc(var(--h) + 30) 60% 16%));border:1px solid rgba(255,255,255,.06);display:grid;place-items:center}
.thumb svg.wave{width:78%;height:56%}
.thumb .prog{position:absolute;inset:auto 0 0 0;height:4px;background:var(--gold);transform-origin:left;transform:scaleX(0)}
.stile.playing .thumb{box-shadow:0 0 0 2px var(--gold)}
.stile.playing .wave rect{animation:bounce .5s ease-in-out infinite alternate}
.stile.looping .prog{transform:scaleX(1)!important;animation:pulse 1s infinite}
@keyframes bounce{to{transform:scaleY(.45)}}
.wave rect{transform-box:fill-box;transform-origin:center}
.thumb:hover{filter:brightness(1.15)}
.thumb .kbd{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);border:0;padding:2px 6px}
.thumb .mode{position:absolute;bottom:10px;right:8px;font-family:var(--mono);font-size:10px;background:rgba(0,0,0,.55);color:var(--fg);padding:2px 6px;border-radius:4px}
.more{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.tw:hover .more,.more:focus-visible,.more[aria-expanded="true"]{opacity:1}
.more svg{width:18px;height:18px}
.sfav{position:absolute;bottom:10px;left:8px;color:var(--gold);pointer-events:none}
.sfav svg{width:14px;height:14px;fill:var(--gold);stroke:var(--gold)}
.stile b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stile small{color:var(--muted);font-size:12px;margin-top:-6px}
.thumb.add{background:var(--panel);border:1.5px dashed var(--line);color:var(--muted)}
.thumb.add .ico{width:34px;height:34px}
.drop{position:fixed;inset:0;background:color-mix(in srgb,var(--ember) 15%,transparent);border:3px dashed var(--ember);z-index:60;display:grid;place-items:center;font-family:var(--display);font-size:22px;pointer-events:none}

.pop{position:fixed;z-index:55;width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:10px;max-height:min(80vh,560px);overflow:auto}
.blist{display:grid;gap:2px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--panel2)}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px}
.brow:hover{background:rgba(255,255,255,.04)}
.brow input[type=text]{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--fg);font:inherit;font-size:14px;padding:3px 6px}
.brow input[type=text]:hover,.brow input[type=text]:focus{border-color:var(--line);outline:none}
.brow small{display:block;color:var(--dim);font-size:11.5px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.brow .tag{font-size:11.5px;color:var(--dim);white-space:nowrap}
.brow.off{opacity:.5}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ember);transition:width .2s}
.aistat{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.aistat.warn{border-color:var(--gold)}
.aistat.bad{border-color:var(--bad)}
.stk-rng{font:600 12.5px var(--body);padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}.stk-rng.up{color:var(--ok)}.stk-rng.down{color:var(--bad)}
.aiload{margin-left:auto;flex:none;font:700 11.5px var(--mono);padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}.aiload.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}.aiload.warn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}.aiload.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.pop h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-top:4px}
.pop label.ck{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0;cursor:pointer}
.pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--ember)}
.txt{height:38px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);padding:0 12px;width:100%;min-width:0}
.txt:focus{border-color:var(--gold);outline:none}

/* Right panel */
.panel{background:var(--rail);border-left:1px solid var(--line);overflow:auto;padding-block:0 120px}
.hero{position:relative;padding:20px;background:radial-gradient(140% 90% at 50% 0%,hsl(var(--h) 60% 26%),transparent 70%);border-bottom:1px solid var(--line)}
.hero .av{width:120px;height:120px;display:block;margin:6px auto 12px}
.hero h2{font-family:var(--display);font-size:22px;font-weight:700;text-align:center}
.hero p{text-align:center;color:var(--muted);margin:4px 0 14px;font-size:14px}
.hero .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hero .star{top:14px;right:14px}
.pbody{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.rec-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:20px;border-radius:18px;border:1px solid var(--line);background:radial-gradient(120% 140% at 0% 0%,rgba(255,90,82,.10),transparent 55%),var(--panel)}
.rec-hero.live{border-color:rgba(255,90,82,.55);background:radial-gradient(120% 140% at 0% 0%,rgba(255,90,82,.22),transparent 60%),var(--panel)}
.recbtn{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);transition:transform .15s,border-color .15s}
.recbtn:hover{transform:scale(1.04);border-color:var(--bad)}
.recbtn i{display:block;width:34px;height:34px;border-radius:50%;background:var(--bad);transition:border-radius .2s,width .2s,height .2s}
.rec-hero.live .recbtn{border-color:var(--bad)}
.rec-hero.live .recbtn i{width:28px;height:28px;border-radius:6px}
.rec-hero h2{font-family:var(--display);font-size:20px;letter-spacing:-.3px}
.rec-hero .time{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1.1}
.rec-hero p{color:var(--muted);font-size:13.5px;margin-top:4px}
.rec-hero .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:8px;vertical-align:middle;animation:recpulse 1.2s ease-in-out infinite}
.recdot.paused{animation:none;background:var(--gold)}
@keyframes recpulse{50%{opacity:.25}}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.src{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left;min-width:0}
.src:hover{border-color:#4a4038}
.src[aria-pressed="true"]{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.src .th{width:100%;aspect-ratio:16/9;border-radius:8px;background:#000 center/contain no-repeat;display:grid;place-items:center;color:var(--dim)}
.src span{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src span img{width:16px;height:16px;flex:none}
.src span em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.recsrc-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.recsrc-row .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);color:var(--muted)}
.recsrc-row b{display:block;font-size:14.5px}
.recsrc-row p{color:var(--muted);font-size:13px;margin-top:2px}
.recsrc-row .fader{grid-column:2/4;margin-top:4px}
.reclist{display:grid;gap:10px}
.recitem{display:grid;grid-template-columns:132px 1fr;gap:12px;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--panel);align-items:center}
.recitem .thumb{position:relative;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#000;display:grid;place-items:center;color:var(--dim);cursor:pointer}
.recitem .thumb video{width:100%;height:100%;object-fit:cover;display:block}
.recitem .thumb .dur{position:absolute;right:5px;bottom:5px;font-size:11px;font-weight:600;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:5px;color:#fff;font-variant-numeric:tabular-nums}
.recitem .thumb .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;background:rgba(0,0,0,.35);transition:opacity .15s;color:#fff}
.recitem .thumb:hover .play{opacity:1}
.recitem .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recitem input.txt{height:32px}
.recitem .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.recitem .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dbtn.rec i{display:block;width:16px;height:16px;border-radius:50%;background:var(--bad);transition:border-radius .2s}
.dbtn.rec.on{background:rgba(255,90,82,.18);box-shadow:0 0 0 2px var(--bad) inset}
.dbtn.rec.on i{border-radius:3px;width:14px;height:14px}
.tiles.q4{grid-template-columns:repeat(4,1fr)}
.picard{width:min(760px,100%)}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:46vh;overflow:auto;padding:2px}
.picit{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left;min-width:0}
.picit:hover{border-color:var(--ember)}
.picit .im{width:100%;aspect-ratio:1;border-radius:9px;background:#0b0a09 center/cover no-repeat}
.picit span{width:100%;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picit .badge{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.04em;background:rgba(0,0,0,.65);color:#fff;padding:1px 6px;border-radius:5px;border:0}
.picit.busy{pointer-events:none;opacity:.6}
.picsearch{display:flex;gap:8px}
.picsearch input{flex:1;height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;padding:0 12px}
.picsearch input:focus{outline:none;border-color:var(--ember)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;max-height:34vh;overflow:auto;padding:2px}

<script type="text/plain" id="vbscript"><# : VanMule - VB-Cable setup. Double-click to run.
@echo off
set "VAN_SELF=%~f0"
powershell -NoProfile -ExecutionPolicy Bypass -Command "Invoke-Expression ([System.IO.File]::ReadAllText($env:VAN_SELF))"
exit /b
#>
$ErrorActionPreference = 'Stop'
$self = $env:VAN_SELF
function Test-Admin { ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator) }
function Find-Cable { Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*VB-Audio Virtual Cable*' } }
Write-Host ''
Write-Host '  VanMule - VB-Cable setup' -ForegroundColor Yellow
Write-Host '  Installs VB-CABLE (free, by VB-Audio) so Discord can hear VanMule.'
Write-Host ''
if (-not (Test-Admin)) {
  Write-Host '  Asking Windows for administrator permission...'
  Start-Process -FilePath $self -Verb RunAs
  exit
}
if (Find-Cable) {
  Write-Host '  VB-Cable is already installed.' -ForegroundColor Green
  Write-Host '  Open VanMule, go to Settings > Audio and click Set up for Discord.'
  Read-Host '  Press Enter to close'
  exit
}
$url = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip'
$dir = Join-Path $env:TEMP 'VanMule-VBCable'
$zip = Join-Path $dir 'VBCABLE_Driver_Pack45.zip'
try {
  New-Item -ItemType Directory -Force -Path $dir | Out-Null
  Write-Host '  Downloading from vb-audio.com...'
  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
  Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
  Write-Host '  Unpacking...'
  Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
  $name = if ([Environment]::Is64BitOperatingSystem) { 'VBCABLE_Setup_x64.exe' } else { 'VBCABLE_Setup.exe' }
  $exe = Get-ChildItem -Path $dir -Recurse -Filter $name | Select-Object -First 1
  if (-not $exe) { throw "Could not find $name in the download." }
  $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
  if ($sig.Status -ne 'Valid') { throw "The installer's digital signature is not valid ($($sig.Status)). Stopping for safety." }
  Write-Host ('  Installer signature checked: ' + $sig.SignerCertificate.GetNameInfo('SimpleName', $false))
  Write-Host ''
  Write-Host '  Installing. If Windows asks to install the device software, click Install.' -ForegroundColor Yellow
  Start-Process -FilePath $exe.FullName -ArgumentList '-i', '-h' -Wait
  Start-Sleep -Seconds 2
  Write-Host ''
  if (Find-Cable) { Write-Host '  VB-Cable is installed.' -ForegroundColor Green }
  else { Write-Host '  The installer finished. Windows will list the cable after a restart.' -ForegroundColor Yellow }
  Write-Host ''
  Write-Host '  Next: restart your PC, open VanMule in Chrome or Edge,'
  Write-Host '  go to Settings > Audio and click Set up for Discord.'
  Write-Host ''
  $r = Read-Host '  Restart now? (y/n)'
  if ($r -match '^[yY]') { Restart-Computer }
}
catch {
  Write-Host ''
  Write-Host ('  Setup failed: ' + $_.Exception.Message) -ForegroundColor Red
  Write-Host '  You can install it by hand from https://vb-audio.com/Cable/'
  Read-Host '  Press Enter to close'
}
</script>

const WORKLET = `
function makeFFT(n){
  const rev=new Uint32Array(n), bits=Math.log2(n);
  for(let i=0;i<n;i++){ let r=0,x=i; for(let b=0;b<bits;b++){ r=(r<<1)|(x&1); x>>=1; } rev[i]=r; }
  const cs=new Float64Array(n/2), sn=new Float64Array(n/2);
  for(let i=0;i<n/2;i++){ cs[i]=Math.cos(2*Math.PI*i/n); sn[i]=Math.sin(2*Math.PI*i/n); }
  return function(re,im,inv){
    for(let i=0;i<n;i++){ const j=rev[i]; if(j>i){ let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; } }
    for(let size=2;size<=n;size<<=1){
      const half=size>>1, step=n/size;
      for(let i=0;i<n;i+=size){
        for(let j=i,k=0;j<i+half;j++,k+=step){
          const l=j+half, c=cs[k], s=inv?sn[k]:-sn[k];
          const tr=re[l]*c-im[l]*s, ti=re[l]*s+im[l]*c;
          re[l]=re[j]-tr; im[l]=im[j]-ti; re[j]+=tr; im[j]+=ti;
        }
      }
    }
  };
}

    const N=(o&&o.processorOptions&&o.processorOptions.n)||2048, os=8, H=N/os;
    this.N=N; this.os=os; this.H=H; this.lat=N-H; this.rover=this.lat;
    this.fft=makeFFT(N);
    this.inF=new Float32Array(N); this.outF=new Float32Array(N); this.acc=new Float32Array(2*N);
    this.win=new Float32Array(N); for(let k=0;k<N;k++) this.win[k]=.5-.5*Math.cos(2*Math.PI*k/N);
    this.re=new Float64Array(N); this.im=new Float64Array(N);
    const B=N/2+1; this.lastPh=new Float64Array(B); this.sumPh=new Float64Array(B);
    this.aMag=new Float64Array(B); this.aFrq=new Float64Array(B); this.sMag=new Float64Array(B); this.sFrq=new Float64Array(B);
    this.env=new Float64Array(B); this.se=new Float64Array(B); this.lg=new Float64Array(B); this.ps=new Float64Array(B+1);

    const out=this.env; for(let k=0;k<B;k++){ const lo=Math.max(0,k-h), hi=Math.min(B,k+h+1); out[k]=(ps[hi]-ps[lo])/(hi-lo); } for(let k=0;k<B;k++) a[k]=out[k]; }

function disposeChain(ch){ if(!ch) return; ch.all.forEach(s=>{ if(s.dispose) s.dispose(); (s.nodes||[]).forEach(n=>{ try{n.disconnect()}catch{} }); (s.oscs||[]).forEach(o=>{ try{o.stop()}catch{} }); }); }
function buildChain(){
  disposeChain(chain);

  const v=voice(), vs=vset(v);
  const head=ctx.createGain(); let last=head; const all=[{nodes:[head]}], by={};
  if(S.vcOn){
    for(const s of v.stages){
      const cfg=Object.assign({},s); for(const k in cfg){ const o=vs.p[s.id+'.'+k]; if(o!==undefined) cfg[k]=o; }
      const st=STAGES[s.type](cfg); last.connect(st.input); last=st.output; all.push(st); by[s.id]=st;
    }

async function startMic(){
  try{
    await ensureCtx(); stopInput(true);
    const c={echoCancellation:S.aec,noiseSuppression:S.ns,autoGainControl:S.agc};
    if(S.devIn) c.deviceId={exact:S.devIn};
    micStream=await navigator.mediaDevices.getUserMedia({audio:c});
    const lbl=(micStream.getAudioTracks()[0]||{}).label||'';
    if(/cable output|vb-audio/i.test(lbl)){
      await listDevices();
      const real=devices.in.find(d=>d.deviceId&&d.deviceId!=='default'&&d.deviceId!=='communications'&&!/cable|vb-audio|voicemeeter/i.test(d.label));
      micStream.getTracks().forEach(t=>t.stop()); micStream=null;
      if(!real){ throw Object.assign(new Error('only cable'),{name:'OnlyCable'}); }
      S.devIn=real.deviceId; save(); toast('Switched to '+real.label+'. The cable is for Discord, not for VanMule.');
      micStream=await navigator.mediaDevices.getUserMedia({audio:Object.assign({},c,{deviceId:{exact:real.deviceId}})});
    }
    inputSrc=ctx.createMediaStreamSource(micStream); inputSrc.connect(N.inGain);
    inputMode='live'; if(S.gen.hearOnStart) S.hear=true;
    applyLevels(); buildChain(); await listDevices(); renderAll(); sys('on'); toast('Microphone live: '+voice().name);
  }catch(e){
    inputMode='blocked'; micErr=e&&e.name?e.name:'Error';
    renderAll(); toast(micErr==='NotAllowedError'?'Microphone access was refused':'Could not start the microphone');
  }
}

const T=()=>ctx.currentTime+.02;
function tone(o,type,f,t,dur,peak=.25,a=.005,f2){ const x=ctx.createOscillator(),g=ctx.createGain(); x.type=type; x.frequency.setValueAtTime(f,t); if(f2) x.frequency.exponentialRampToValueAtTime(f2,t+a+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dur); x.connect(g); g.connect(o); x.start(t); x.stop(t+a+dur+.05); return x; }
function hold(o,type,f,t,dur,peak=.2,ft,ff,q){ const x=ctx.createOscillator(),g=ctx.createGain(); x.type=type; x.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+.02); g.gain.setValueAtTime(peak,Math.max(t+.02,t+dur-.06)); g.gain.linearRampToValueAtTime(0,t+dur); let node=x; if(ft){ const f2=filt(ft,ff,q); x.connect(f2); node=f2; } node.connect(g); g.connect(o); x.start(t); x.stop(t+dur+.02); return x; }
function nz(o,t,dur,peak,ft='lowpass',freq=2000,q=1,f2,a=.003){ const s=ctx.createBufferSource(),f=filt(ft,freq,q),g=ctx.createGain(); s.buffer=noiseBuf(); s.loop=true; if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dur); s.connect(f); f.connect(g); g.connect(o); s.start(t,Math.random()); s.stop(t+a+dur+.05); return f; }
function swell(o,t,dur,peak,ft,f0,f1,q=1){ const s=ctx.createBufferSource(),f=filt(ft,f0,q),g=ctx.createGain(); s.buffer=noiseBuf(); s.loop=true; f.frequency.setValueAtTime(f0,t); f.frequency.exponentialRampToValueAtTime(f1,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+dur*.6); g.gain.linearRampToValueAtTime(0,t+dur); s.connect(f); f.connect(g); g.connect(o); s.start(t,Math.random()); s.stop(t+dur+.05); return f; }
const kick=(o,t,peak=.9,f0=150,f1=45,dur=.35)=>tone(o,'sine',f0,t,dur,peak,.002,f1);
function snare(o,t,peak=.4){ nz(o,t,.14,peak,'highpass',1500); tone(o,'triangle',190,t,.08,peak*.8,.002,140); }
function metal(o,f,t,dur,peak=.2){ [1,2.76,5.4,8.93].forEach((r,i)=>tone(o,'sine',f*r,t,dur/(1+i*.6),peak/(1+i),.002)); }
function chord(o,type,fs,t,dur,peak,ft='lowpass',ff=2500){ fs.forEach(f=>{ hold(o,type,f,t,dur,peak,ft,ff); hold(o,type,f*1.005,t,dur,peak*.6,ft,ff); }); }
function rv(o,amt){ const g=ctx.createGain(); g.connect(o); const s=ctx.createGain(); s.gain.value=amt; g.connect(s); s.connect(o._send); return g; }
function wobble(o,t,f0,f1,dur,lfoHz,lfoDepth,peak=.4){ const x=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),la=ctx.createGain(); x.frequency.setValueAtTime(f0,t); x.frequency.linearRampToValueAtTime(f1,t+dur); l.frequency.value=lfoHz; la.gain.setValueAtTime(lfoDepth,t); la.gain.exponentialRampToValueAtTime(1,t+dur); l.connect(la); la.connect(x.frequency); g.gain.setValueAtTime(peak,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); x.connect(g); g.connect(o); x.start(t); l.start(t); x.stop(t+dur+.05); l.stop(t+dur+.05); }
function applause(o,t,len=2.8){ for(let i=0;i<Math.round(len*95);i++){ const d=Math.random()*len, sw=Math.sin(Math.PI*d/len); nz(o,t+d,.03,.15+.35*sw*Math.random(),'bandpass',900+Math.random()*1800,1.5); } }

async function playSound(s){
  await ensureCtx();
  if(s.cat==='My sounds'&&!s.buf) await decodeMine(s);
  if(s.cat==='My sounds'&&!s.buf){ toast('This sound could not be loaded'); return; }
  const cfg=sndCfg(s.id), mode=cfg.mode, cur=playing.get(s.id);
  if((mode==='toggle'||mode==='loop')&&cur){ stopSound(s.id); tickPlaying(); return; }
  if(mode==='restart') stopSound(s.id);
  if(S.sbExclusive) [...playing.keys()].filter(k=>k!==s.id).forEach(stopSound);
  const entry = playing.get(s.id) || {gains:[],timers:[],start:0,dur:0,loop:false};
  playing.set(s.id,entry);
  const fire=()=>{
    const ng=sndNormGain(s), g=ctx.createGain(); g.gain.value=cfg.vol/100*ng; g.connect(N.sbBus);
    const send=ctx.createGain(); send.gain.value=cfg.vol/100*ng; send.connect(N.sbVerb); g._send=send;
    let dur;
    if(s.buf){ const src=ctx.createBufferSource(); src.buffer=s.buf; if(mode==='loop') src.loop=true; src.connect(g); src.start(); dur=s.buf.duration; g._src=src; }
    else dur=s.fn(g,T());
    entry.gains.push(g); entry.start=performance.now(); entry.dur=dur;

    else entry.timers.push(setTimeout(()=>{ try{g.disconnect()}catch{} try{send.disconnect()}catch{} entry.gains=entry.gains.filter(x=>x!==g); if(!entry.gains.length&&playing.get(s.id)===entry) playing.delete(s.id); tickPlaying(); },dur*1000+1500));

function waveSvg(seed){
  let h=0; for(const c of seed) h=(h*31+c.charCodeAt(0))>>>0;
  let bars=''; for(let i=0;i<18;i++){ h=(h*1103515245+12345)>>>0; const v=.18+((h>>>8)%1000)/1000*.82, env=Math.sin(Math.PI*(i+.5)/18)*.6+.4, ht=Math.max(6,v*env*60); bars+=`<rect x="${i*10+2}" y="${((60-ht)/2).toFixed(1)}" width="6" height="${ht.toFixed(1)}" rx="3" fill="rgba(255,255,255,.82)" style="animation-delay:${(i%5)*-.1}s"/>`; }
  return `<svg class="wave" viewBox="0 0 180 60" aria-hidden="true">${bars}</svg>`;
}
/* IndexedDB for user sounds */
function idbOpen(name){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open(name,1); r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('sounds')) r.result.createObjectStore('sounds',{keyPath:'id'}); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
// Sounds saved in the browser live in the 'vanmule' database; ones from the old 'voxforge' database are copied over once.
let idbReady=null;
function idb(){
  if(!idbReady) idbReady=(async()=>{
    const db=await idbOpen('vanmule');
    try{
      const had=indexedDB.databases?(await indexedDB.databases()).some(d=>d.name==='voxforge'):true;
      if(had&&!localStorage.getItem('vanmuleIdbMoved')){
        const old=await idbOpen('voxforge');
        const recs=await new Promise(r=>{ const q=old.transaction('sounds').objectStore('sounds').getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); });
        if(recs.length) await new Promise(r=>{ const tx=db.transaction('sounds','readwrite'); recs.forEach(x=>tx.objectStore('sounds').put(x)); tx.oncomplete=r; tx.onerror=r; });
        old.close(); try{ indexedDB.deleteDatabase('voxforge'); }catch{}
        localStorage.setItem('vanmuleIdbMoved','1');
      }
    }catch{}
    return db;
  })();
  return idbReady;
}
async function idbAll(){ try{ const db=await idb(); return await new Promise(r=>{ const q=db.transaction('sounds').objectStore('sounds').getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); }); }catch{ return []; } }

function sniffExt(ab,fallback){
  const u=new Uint8Array(ab,0,Math.min(12,ab.byteLength)), t=String.fromCharCode(...u);
  if(t.startsWith('RIFF')) return '.wav'; if(t.startsWith('OggS')) return '.ogg'; if(t.startsWith('fLaC')) return '.flac';
  if(t.startsWith('ID3')||(u[0]===0xFF&&(u[1]&0xE0)===0xE0)) return '.mp3'; if(u[0]===0x1A&&u[1]===0x45&&u[2]===0xDF&&u[3]===0xA3) return '.webm';
  if(t.slice(4,8)==='ftyp') return '.m4a'; return fallback||'.wav';
}

async function vpAct(a){

let hueT, gainT;
function newCustom(from){
  const v={id:uid('c'),name:from?from.name+' (custom)':'New voice',cat:'Custom',tag:from?'Built from '+from.name:'Your own voice',hue:from?from.hue:Math.floor(Math.random()*360),face:from?from.face.slice():['dot','smile','none'],bg:from?from.bg:'none',gain:from?from.gain||1.2:1.2,

  if(from&&from.stages.some(s=>s.type==='layer')){ const l=from.stages.find(s=>s.type==='layer'); v.stages.unshift({type:'pv',id:uid('s'),st:l.voices[0][0],fm:l.voices[0][1]}); if(l.voices[1]) v.stages.splice(1,0,{type:'double',id:uid('s'),st:l.voices[1][0]-l.voices[0][0],fm:l.voices[1][1]-l.voices[0][1],mix:l.voices[1][2]}); }

function labAct(a,i,el){
  const v=labVoice(); if(!v) return; const live=()=>{ if(v.id===S.voiceId&&ctx&&inputMode!=='off') buildChain(); };
  if(a==='up'&&i>0){ [v.stages[i-1],v.stages[i]]=[v.stages[i],v.stages[i-1]]; live(); }
  else if(a==='down'&&i<v.stages.length-1){ [v.stages[i+1],v.stages[i]]=[v.stages[i],v.stages[i+1]]; live(); }
  else if(a==='rm'){ v.stages.splice(i,1); live(); }
  else if(a==='add'){ const t=$('#labAdd').value; v.stages.push(Object.assign({type:t,id:uid('s')},structuredClone(MODS[t].d))); live(); }
  else if(a==='carrier'){ v.stages[i].carrier=+el.dataset.c; live(); }
  else if(a==='use'){ selectVoice(v.id); return; }
  else if(a==='dup'){ const c=structuredClone(v); c.id=uid('c'); c.name=v.name+' copy'; c.stages.forEach(s=>s.id=uid('s')); S.custom.push(c); S.labSel=c.id; }
  else if(a==='del'){ if(!labDelArm){ labDelArm=true; renderLab(); setTimeout(()=>{ labDelArm=false; if(S.view==='create'&&S.createTab==='make') renderLab(); },4000); return; }
    labDelArm=false; S.custom=S.custom.filter(x=>x.id!==v.id); S.vfav=S.vfav.filter(x=>x!==v.id); delete S.voiceKeys[v.id]; delete S.vs[v.id]; if(S.voiceId===v.id){ S.voiceId='clean'; live(); if(ctx&&inputMode!=='off') buildChain(); } S.labSel=S.custom[0]?.id||null; toast('Voice deleted'); }
  save(); renderLab(); renderPanel(); renderDock();
}

/* ---- Meters ---- */
const tmp=new Float32Array(1024);
function level(an){ if(!an) return 0; an.getFloatTimeDomainData(tmp); let s=0; for(let i=0;i<tmp.length;i++) s+=tmp[i]*tmp[i]; const db=20*Math.log10(Math.sqrt(s/tmp.length)+1e-6); return Math.max(0,Math.min(1,(db+60)/60)); }
function paintMeter(id,l){ const m=document.getElementById(id); if(!m||!m.offsetParent) return; const n=Math.round(l*48), p=m._n; if(p===n) return; m._n=n; const c=m.children, lo=p==null?0:Math.min(p,n), hi=p==null?48:Math.max(p,n); for(let i=Math.max(0,lo-1);i<Math.min(48,hi+1);i++){ if(c[i]) c[i].className=i<n?(i>=44?'on clip':i>=36?'on hot':'on'):''; } }
let meterT=0, davL=-1;
let npT=0;
function meterNow(ts){ npT=ts; const np=$('#nowp'); if(np){ const t=playing.size?(()=>{ const lst=allSounds(); return [...playing.keys()].map(id=>(lst.find(s=>s.id===id)||{}).name||'').join(', '); })():'Nothing playing'; if(np.textContent!==t) np.textContent=t; } }
function meterLoop(ts){
  if(BGM.bg){ if(ovOpen&&ctx&&ts-ovLvlT>66){ ovLvlT=ts; try{ APP.overlay.push({levels:{in:level(N.inAn),out:level(N.outAn)}}); }catch{} } setTimeout(()=>requestAnimationFrame(meterLoop),ovOpen?60:400); return; }
  if(!ctx){ if(ts-npT>500) meterNow(ts); setTimeout(()=>requestAnimationFrame(meterLoop),500); return; }   // microphone off: nothing to animate
  if(ts-meterT<33){ requestAnimationFrame(meterLoop); return; } meterT=ts;
  { const li=level(N.inAn), lo=level(N.outAn); paintMeter('mIn',li); paintMeter('mOut',lo); paintMeter('mWiz',li); if(ovOpen&&ts-ovLvlT>66){ ovLvlT=ts; try{ APP.overlay.push({levels:{in:li,out:lo}}); }catch{} } const lv=Math.round(li*50)*2; if(Math.abs(lv-davL)>=2){ davL=lv; const d=document.querySelector('.dav'); if(d) d.style.setProperty('--lvl',lv); } }
  if(ts-npT>500) meterNow(ts);
  requestAnimationFrame(meterLoop);
}

function selectVoice(id){ S.voiceId=id; S.vused[id]=Date.now(); save(); if(ctx&&inputMode!=='off'){ applyLevels(); buildChain(); } if(S.view==='voices') renderVoices(); pushOverlay(); if(S.view==='create'&&S.createTab==='make') renderLab(); renderPanel(); renderDock(); toast(voice().name); }
function toggleVC(){ S.vcOn=!S.vcOn; save(); if(ctx&&inputMode!=='off'){ buildChain(); sys(S.vcOn?'on':'off'); } renderAll(); toast('Voice changer '+(S.vcOn?'on':'off')); }
function toggleHear(){ S.hear=!S.hear; save(); applyLevels(); renderDock(); toast('Hear myself '+(S.hear?'on':'off')); }

function aiActivate(v,st){
  if(!APP||!APP.ai||!v||!v.aiId) return;
  aiParams({pitch:st||0});
  if(aiState&&!aiState.base){ openAiModal('download'); return; }
  if(!aiState||aiState.loaded!==v.aiId){ aiLoading=v.aiId; aiErr=''; APP.ai.send({cmd:'load',id:v.aiId}); setTimeout(()=>{ if(S.view!=='settings') renderPanel(); },0); }
}
function refreshAiViews(){ if(S.view==='voices') renderVoices(); if(S.view==='create') renderCreate(); pushOverlay(); if(S.view==='settings'&&S.tab==='ai') renderSettings(); if(S.view!=='sounds') renderPanel(); renderDock(); }
function onAiEvent(m){
  switch(m.type){
    case 'status': {
      const first=!aiState; aiState=m; aiPending=false;
      if(aiSelectAfter&&m.voices.some(v=>'ai:'+v.id===aiSelectAfter)){ const id=aiSelectAfter; aiSelectAfter=null; aiImporting=false; S.view='voices'; save(); selectVoice(id); renderAll(); return; }
      if(first&&String(S.voiceId).startsWith('ai:')){ if(!m.voices.some(v=>'ai:'+v.id===S.voiceId)) { S.voiceId='clean'; } else if(S.ai.warm!==false&&m.base&&!m.loaded&&!aiLoading){ aiLoading=S.voiceId.slice(3); aiParams({pitch:paramVal(voice(),'ai','st')}); APP.ai.send({cmd:'load',id:aiLoading}); } if(ctx&&inputMode!=='off') buildChain(); }
      refreshAiViews(); break; }
    case 'progress': aiProg=m; if(aiModal) aiModal.state='downloading'; clearTimeout(aiWatch); updateAiModal(); break;
    case 'baseImported': aiProg=null; aiErr=''; if(m.ready){ closeAiModal(); toast('AI engine ready'); { const v=voice(); if(v.cat==='AI') aiActivate(v,paramVal(v,'ai','st')); } } else { aiErr='Got '+m.got.join(' and ')+'. Still missing one file: pick the other one too.'; if(aiModal) aiModal.state='failed'; updateAiModal(); } break;
    case 'f0': if(m.f0&&S.ai.f0!==m.f0&&m.reason!=='NEED_FCPE'){ toast('Pitch tracker: using the basic one ('+String(m.reason||'').slice(0,80)+')'); } break;
    case 'downloaded': if(m.what==='fcpe'){ aiProg=null; closeAiModal(); toast('Fast pitch tracker ready'); if(aiState) aiState.fcpe=true; if(S.view==='settings') renderSettings(); break; } aiProg=null; closeAiModal(); toast('AI engine downloaded'); { const v=voice(); if(v.cat==='AI') aiActivate(v,paramVal(v,'ai','st')); } break;
    case 'imported': toast('Imported '+m.voice.name); aiSelectAfter='ai:'+m.voice.id; break;
    case 'scan': if(!bulk||bulk.state!=='scanning') break;
      bulk.items=m.items.map(x=>Object.assign(x,{on:!x.dup})); bulk.attached=m.attached||0; bulk.state='review'; renderBulk(); break;
    case 'bulk': if(bulk){ bulk.state='importing'; bulk.i=m.i; bulk.n=m.n; bulk.name=m.name; renderBulk(); } break;
    case 'bulkDone': aiImporting=false; if(!bulk) bulk={}; bulk.state='done'; bulk.result=m; $('#bulkmodal').hidden=false; renderBulk(); refreshAiViews(); break;
    case 'removedAll': toast('Removed '+m.n+' AI voice'+(m.n===1?'':'s')); if(aiReimport){ aiReimport=false; setTimeout(aiImportFolder,300); } break;
    case 'indexSet': toast(m.cleared?'Index file removed':'Index file added'+(m.name?' to '+m.name:'')); break;
    case 'imageSet': toast(m.cleared?'Picture removed':'Picture updated'); break;
    case 'loaded': aiLoading=null; aiErr=''; toast('AI voice ready on your '+(m.device==='gpu'?'graphics card':'processor')); refreshAiViews(); break;
    case 'stats': aiStats=m; updateAiStats(); aiAutoTune(m); break;
    case 'error':
      aiLoading=null; aiImporting=false;
      if(m.cmd==='scan'&&bulk){ bulk.state='error'; bulk.err=m.msg; renderBulk(); break; }
      if(m.cmd==='importMany'&&bulk){ bulk.state='done'; bulk.result={done:[],failed:[{name:'Import',msg:m.msg}]}; renderBulk(); break; }
      if(m.cmd==='fcpe'){ aiProg=null; closeAiModal(); toast(m.msg); S.ai.f0='rmvpe'; save(); aiParams(); if(S.view==='settings') renderSettings(); break; }
      if(m.msg==='NEED_DOWNLOAD'){ openAiModal('download'); break; }
      if(m.msg==='ENCODER_INCOMPATIBLE'){ if(!aiModal) openAiModal('altenc'); break; }
      aiErr=m.msg; toast(m.msg); if(aiModal&&(m.cmd==='download'||m.cmd==='importBase')){ aiModal.state='failed'; aiProg=null; clearTimeout(aiWatch); } if(aiModal) updateAiModal(); refreshAiViews(); break;
    case 'exit': if(aiModal&&aiModal.state==='downloading'){ aiModal.state='failed'; aiErr='The AI engine closed during the download.'; updateAiModal(); }
      if(aiState) aiState=Object.assign({},aiState,{loaded:null}); aiLoading=null; aiErr='The AI engine stopped. Select the voice again to restart it.'; refreshAiViews(); break;
  }
}

function aiStatsText(){

function fmtDur(ms){ const t=Math.max(0,Math.floor(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t/60)%60, s=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); }
function fileUrl(p){ const n=String(p).replace(/\\/g,'/'); return 'file:///'+n.replace(/^\/+/,'').split('/').map((seg,i)=>i===0&&/^[a-z]:$/i.test(seg)?seg:encodeURIComponent(seg)).join('/'); }
function pickMime(video){
  const list=video?['video/mp4;codecs=avc1.640032,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1,opus','video/mp4','video/webm;codecs=h264,opus','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']
    :['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return {mime:m,ext:m.startsWith('video/mp4')?'.mp4':m.startsWith('audio/mp4')?'.m4a':'.webm'}; }catch{} }
  return {mime:'',ext:'.webm'};
}
async function capLoadSources(force){
  if(!APP||!APP.rec||capSrcLoading) return;
  if(capSources&&!force) return;
  capSrcLoading=true; if(S.view==='record') renderRecord();
  try{ capSources=await APP.rec.sources(); }catch(e){ capSources=[]; }
  capSrcLoading=false;
  const c=capCfg();
  if(!capSources.some(x=>x.id===c.src)){ const scr=capSources.find(x=>x.screen); c.src=scr?scr.id:(capSources[0]&&capSources[0].id)||''; save(); }
  if(S.view==='record') renderRecord();
}
async function capStart(){
  if(CAP) return;
  if(!APP||!APP.rec){ toast('Recording needs the VanMule desktop app'); return; }
  const c=capCfg(), q=REC_Q[c.q]||REC_Q['1080p30'], wantVideo=c.mode==='video';
  if(!wantVideo&&!c.game&&!c.voice){ toast('Turn on game audio or your voice to record audio'); return; }
  CAP={starting:true}; renderCapUi();
  const tracks=[], nodes=[], stopAfter=[]; let warn='';
  try{
    // 1) Desktop picture and/or desktop sound (Windows records "what you hear" with the screen capture)
    let desk=null;
    if(wantVideo||c.game){
      if(!capSources||!capSources.some(x=>x.id===c.src)) { capSources=null; await capLoadSources(true); }
      let src=c.src; if(!wantVideo){ const scr=(capSources||[]).find(x=>x.screen); if(scr) src=scr.id; }
      if(!src) throw new Error('No screen or window was found to record.');
      const video={mandatory:{chromeMediaSource:'desktop',chromeMediaSourceId:src,maxWidth:q.w,maxHeight:q.h,maxFrameRate:wantVideo?q.fps:5}};
      try{ desk=await navigator.mediaDevices.getUserMedia({video,audio:c.game?{mandatory:{chromeMediaSource:'desktop'}}:false}); }
      catch(e){
        if(!c.game) throw e;
        desk=await navigator.mediaDevices.getUserMedia({video,audio:false});
        warn='Game audio could not be captured on this PC, so only your voice is in the recording.';
      }
      stopAfter.push(desk);
      if(wantVideo){ const vt=desk.getVideoTracks()[0]; if(vt){ tracks.push(vt); vt.addEventListener('ended',()=>{ if(CAP&&!CAP.stopping) capStop('The window you were recording closed.'); }); } }
    }
    // 2) Mix the sound in VanMule's audio engine
    await ensureCtx();
    if(c.voice&&inputMode!=='live'){ try{ await startMic(); }catch{} }
    const dest=ctx.createMediaStreamDestination();
    const gameTrack=desk&&desk.getAudioTracks()[0];
    if(gameTrack){
      const src=ctx.createMediaStreamSource(new MediaStream([gameTrack])), g=ctx.createGain(); g.gain.value=c.gameVol/100;
      src.connect(g); g.connect(dest); nodes.push(src,g); CAP.gameGain=g;
    }
    let voiceNote='';
    if(c.voice){
      // Your headset output is part of the game audio. Avoid recording your voice twice when you hear it back.
      let tap=N.master;
      if(gameTrack&&split()) tap=S.hear?null:N.voiceMix;
      if(tap){ const g=ctx.createGain(); g.gain.value=c.voiceVol/100; tap.connect(g); g.connect(dest); nodes.push(g); CAP.voiceGain=g; CAP.voiceTap=tap; }
      else voiceNote='Your voice is recorded through hear-back.';
      if(inputMode!=='live') warn=warn||'The microphone is off, so your voice is not in the recording.';
    }
    const at=dest.stream.getAudioTracks()[0]; if(at&&(gameTrack||CAP.voiceGain)) tracks.push(at);
    if(!tracks.length) throw new Error('Nothing to record. Turn on a sound source or pick video.');
    const {mime,ext}=pickMime(wantVideo);
    const rec=new MediaRecorder(new MediaStream(tracks),Object.assign(mime?{mimeType:mime}:{},{audioBitsPerSecond:192000},wantVideo?{videoBitsPerSecond:q.vbr}:{}));
    const f=await APP.rec.open({ext});
    Object.assign(CAP,{starting:false,rec,id:f.id,file:f.file,path:f.path,ext,mime:rec.mimeType||mime,t0:Date.now(),pausedMs:0,paused:false,pauseAt:0,bytes:0,q:Promise.resolve(),nodes,stopAfter,dest,video:wantVideo,note:voiceNote});
    rec.ondataavailable=e=>{ if(!e.data||!e.data.size) return; const blob=e.data; CAP.q=CAP.q.then(async()=>{ const b=await blob.arrayBuffer(); APP.rec.chunk(f.id,b); if(CAP) CAP.bytes+=b.byteLength; }); };
    rec.onstop=()=>capFinish();
    rec.onerror=e=>{ toast('Recording error: '+((e.error&&e.error.message)||'unknown')); capStop(); };
    rec.start(1000);
    clearInterval(capTick); capTick=setInterval(capTickFn,500);
    if(warn) toast(warn); else toast(wantVideo?'Recording started':'Audio recording started');
  }catch(e){
    for(const st of stopAfter) st.getTracks().forEach(t=>t.stop());
    for(const n of nodes){ try{ n.disconnect(); }catch{} }
    CAP=null; renderCapUi();
    toast('Could not start recording: '+(e&&e.message||e));
    return;
  }
  renderCapUi();
}
function capStop(reason){
  if(!CAP||CAP.stopping||CAP.starting) return;
  CAP.stopping=true; CAP.reason=reason||'';
  try{ if(CAP.rec.state!=='inactive') CAP.rec.stop(); else capFinish(); }catch{ capFinish(); }
  renderCapUi();
}
async function capFinish(){
  const c=CAP; if(!c||c.finished) return; c.finished=true;
  clearInterval(capTick);
  try{ await c.q; }catch{}
  for(const st of c.stopAfter||[]) st.getTracks().forEach(t=>t.stop());
  if(c.voiceTap&&c.voiceGain){ try{ c.voiceTap.disconnect(c.voiceGain); }catch{} }
  for(const n of c.nodes||[]){ try{ n.disconnect(); }catch{} }
  const r=await APP.rec.close(c.id).catch(()=>null);
  CAP=null; renderCapUi(); recList=null;
  if(r&&r.ok) toast((c.reason?c.reason+' ':'')+'Saved '+r.file+' ('+fmtMB(r.size)+')'); else toast('The recording could not be saved: '+((r&&r.error)||'unknown error'));
  if(S.view==='record') renderRecord();
}
function capPause(){

  if(CAP.paused){ CAP.rec.resume(); CAP.pausedMs+=Date.now()-CAP.pauseAt; CAP.paused=false; toast('Recording resumed'); }
  else { CAP.rec.pause(); CAP.paused=true; CAP.pauseAt=Date.now(); toast('Recording paused'); }
  renderCapUi();
}

async function recAct(op,file){
  if(op==='rename'){ recRenaming=file; renderRecList(); return; }
  if(op==='dorename'){ const n=($('#recName')||{}).value; recRenaming=null; if(n&&n.trim()){ try{ await APP.rec.action({op:'rename',file,name:n.trim()}); }catch(e){ toast('Could not rename: '+e.message); } } await loadRecList(); return; }
  if(op==='delete'){ if(recDelArm!==file){ recDelArm=file; renderRecList(); setTimeout(()=>{ if(recDelArm===file){ recDelArm=null; renderRecList(); } },4000); return; }
    recDelArm=null; await APP.rec.action({op:'delete',file}); toast('Moved to the Recycle Bin'); await loadRecList(); return; }
  await APP.rec.action({op,file});
}

async function picSearch(){
  if(!pic) return; const q=pic.q.trim(); if(!q) return;
  pic.loading=true; pic.err=''; pic.results=null; renderPicker();
  const tok=pic.tok=Date.now();
  const enc=encodeURIComponent(q), out=[];
  try{
    const [wp,cm]=await Promise.allSettled([
      fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${enc}&gsrlimit=12&prop=pageimages&piprop=thumbnail&pithumbsize=400&pilicense=any`).then(r=>r.json()),
      fetch(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrsearch=${enc}%20filetype:bitmap&gsrlimit=24&prop=imageinfo&iiprop=url|mime&iiurlwidth=400`).then(r=>r.json())
    ]);
    if(wp.status==='fulfilled'&&wp.value.query) Object.values(wp.value.query.pages).sort((a,b)=>a.index-b.index).forEach(p=>{ if(p.thumbnail&&p.thumbnail.source) out.push({src:'Wikipedia',title:p.title,thumb:p.thumbnail.source,url:p.thumbnail.source}); });
    if(cm.status==='fulfilled'&&cm.value.query) Object.values(cm.value.query.pages).sort((a,b)=>a.index-b.index).forEach(p=>{ const ii=p.imageinfo&&p.imageinfo[0]; if(ii&&ii.thumburl&&/image\/(png|jpeg|gif|webp)/.test(ii.mime||'image/jpeg')) out.push({src:'Commons',title:p.title.replace(/^File:/,'').replace(/\.[a-z0-9]+$/i,''),thumb:ii.thumburl,url:ii.mime==='image/gif'&&ii.url?ii.url:ii.thumburl}); });
    if(wp.status==='rejected'&&cm.status==='rejected') throw new Error('No internet connection, or the image search is blocked.');
  }catch(e){ if(pic&&pic.tok===tok){ pic.err=e.message||String(e); } }
  if(!pic||pic.tok!==tok) return;
  pic.loading=false; pic.results=out; renderPicker();

    for(const x of lay){ const sg=stuSegment(x.l); if(!sg) continue; const o=Math.floor(x.start*SR); for(let i=0;i<sg.length&&o+i<total;i++) out[o+i]+=sg[i]; }
    const bgs=stuBgSeg(p,total/SR); if(bgs) for(let i=0;i<Math.min(total,bgs.length);i++) out[i]+=bgs[i];
    let pk=0; for(let i=0;i<out.length;i++){ const a=Math.abs(out[i]); if(a>pk) pk=a; } if(pk>0){ const g=0.95/pk; if(g<1||S.studio.normalize!==false) for(let i=0;i<out.length;i++) out[i]*=g; }
    const {data,ext}=await vmEncode(out,SR);
    const saved=await APP.vmsg.save({data,ext,name:p.name});
    vmList=null; vmLast=Object.assign(saved,{dur:out.length/SR});
    STU.busy='';
    if(copy){ const r=await APP.vmsg.action({op:'copy',file:saved.file}); toast(r&&r.ok?'Copied "'+p.name+'". Paste it into Discord with Ctrl+V.':(r&&r.error)||'Saved, but could not copy'); }
    else toast('Saved "'+saved.file+'" to your voice messages');
  }catch(e){ STU.busy=''; toast('Could not export: '+(e.message||e)); }
  renderStudio();
}

async function stuRevoice(lid,voiceId){
  const p=stuProj(), l=p&&p.lines.find(x=>x.id===lid), dry=l&&STU.buf.get(l.id+'dry'), v=allVoices().find(x=>x.id===voiceId);
  if(!l||!dry||!v||STU.rec||STU.busy) return;
  await ensureCtx(); stuStop();
  const prev=S.voiceId, prevOn=S.vcOn; if(!S.vcOn){ S.vcOn=true; }
  if(S.voiceId!==v.id) selectVoice(v.id); else buildChain();
  if(v.cat==='AI'){ STU.busy='Loading '+v.name+'…'; renderStudio(); for(let i=0;i<300&&!(aiState&&aiState.loaded===v.aiId);i++) await new Promise(r=>setTimeout(r,100)); if(!(aiState&&aiState.loaded===v.aiId)){ STU.busy=''; toast(v.name+' could not be loaded'); renderStudio(); return; } await new Promise(r=>setTimeout(r,300)); }
  STU.busy='Changing the voice to '+v.name+'…'; renderStudio();
  // Mute the live mic and the feed to Discord, play your plain take through the new voice, and record the result.
  const micWasOn=inputSrc&&inputMode==='live'; if(micWasOn){ try{ inputSrc.disconnect(N.inGain); }catch{} }
  N.callGate.gain.setTargetAtTime(0,ctx.currentTime,.01);
  const dest=ctx.createMediaStreamDestination(); N.voiceMix.connect(dest);
  let mime=''; for(const m of ['audio/webm;codecs=opus','audio/webm']) { try{ if(MediaRecorder.isTypeSupported(m)){ mime=m; break; } }catch{} }
  const rec=new MediaRecorder(dest.stream,mime?{mimeType:mime,audioBitsPerSecond:160000}:{}), chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const b=ctx.createBuffer(1,dry.length,SR); b.copyToChannel(dry,0); const src=ctx.createBufferSource(); src.buffer=b; src.connect(N.hp);
  rec.start(200); await new Promise(r=>setTimeout(r,60)); src.start();
  const tail=v.cat==='AI'?S.ai.blockSec+0.6:0.25;
  await new Promise(r=>setTimeout(r,(dry.length/SR+tail)*1000));
  await new Promise(res=>{ rec.onstop=res; rec.stop(); });
  try{ src.disconnect(); }catch{} try{ N.voiceMix.disconnect(dest); }catch{}
  if(micWasOn&&inputSrc){ try{ inputSrc.connect(N.inGain); }catch{} }
  if(S.voiceId!==prev) selectVoice(prev); if(!prevOn){ S.vcOn=false; save(); buildChain(); renderDock(); }
  applyLevels();
  try{
    const pcm=await toMono48(await new Blob(chunks,{type:rec.mimeType||'audio/webm'}).arrayBuffer());
    STU.busy='';
    const nl=await stuAddPcm(pcm,{voiceId:v.id,voiceName:v.name,replace:l.id,keepTrim:false,hasDry:true,fin:l.fin,fout:l.fout});
    STU.buf.set(nl.id+'dry',dry); APP.studio({op:'save',pid:p.id,lid:nl.id+'dry',data:wavBytes(dry)});
    toast('Line '+(p.lines.indexOf(nl)+1)+' is now '+v.name);
  }catch(e){ STU.busy=''; toast('Could not change the voice: '+(e.message||e)); renderStudio(); }
}

async function stuSetBg(kind,ref){
  const p=stuProj()||stuNewProj(); STU.busy='Adding background music…'; renderStudio();
  try{
    let ab,name;
    if(kind==='vmsg'){ ab=await APP.vmsg.action({op:'read',file:ref}); name=ref.replace(/\.[^.]+$/,''); }
    else { const so=mySounds.find(x=>x.id===ref); if(!so) throw new Error('Sound not found'); ab=so.file&&FILES?await FILES('readSound',{file:so.file}):so.data; name=so.name; }
    const pcm=await toMono48(ab); stuSnap();
    STU.buf.set('bg'+p.id,pcm); await APP.studio({op:'save',pid:p.id,lid:'bgm',data:wavBytes(pcm)});
    p.bg={name,vol:p.bg?p.bg.vol:25,loop:true}; save();
  }catch(e){ toast('Could not add music: '+(e.message||e)); }
  STU.busy=''; renderStudio();
}
function stuBgSeg(p,total){
  const bg=p&&p.bg, pcm=bg&&STU.buf.get('bg'+p.id); if(!pcm||!total) return null;
  const n=Math.ceil(total*SR), out=new Float32Array(n), g=bg.vol/100, fo=Math.min(n,SR);
  for(let i=0;i<n;i++){ const j=bg.loop?i%pcm.length:i; if(j>=pcm.length) break; let k=g; if(i>n-fo) k*=(n-i)/fo; if(i<SR*0.3) k*=i/(SR*0.3); out[i]=pcm[j]*k; }
  return out;
}

async function stuImport(kind,file){

    let ab, name;
    if(kind==='vmsg'){ ab=await APP.vmsg.action({op:'read',file}); name=file.replace(/\.[^.]+$/,''); }
    else { const s=mySounds.find(x=>x.id===file); if(!s) throw new Error('Sound not found'); ab=s.file&&FILES?await FILES('readSound',{file:s.file}):s.data; name=s.name; }

function stuLineAct(a,lid){
  const p=stuProj(); if(!p) return; const i=p.lines.findIndex(x=>x.id===lid), l=p.lines[i]; if(!l) return;
  if(a==='play'){ if(STU.play) { stuStop(); return; } stuPlay(l.id); return; }
  if(a==='fin'||a==='fout'){ stuSnap(); l[a]=!l[a]; save(); renderStudio(); return; }
  if(a==='reset'){ stuSnap(); l.a=0; l.b=l.dur; save(); renderStudio(); return; }
  if(a==='redo'){ STU.sel=l.voiceId; stuRecStart(l.voiceId,l.id); return; }
  if(a==='dup'){ const pcm=STU.buf.get(l.id); if(!pcm) return; const id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); stuSnap(); const nl=Object.assign({},l,{id}); STU.buf.set(id,pcm); if(STU.buf.has(l.id+'dry')){ STU.buf.set(id+'dry',STU.buf.get(l.id+'dry')); APP.studio({op:'save',pid:p.id,lid:id+'dry',data:wavBytes(STU.buf.get(l.id+'dry'))}); } APP.studio({op:'save',pid:p.id,lid:id,data:wavBytes(pcm)}); p.lines.splice(i+1,0,nl); save(); renderStudio(); return; }
  if(a==='del'){ if(STU.delArm!==l.id){ STU.delArm=l.id; renderStudio(); setTimeout(()=>{ if(STU.delArm===l.id){ STU.delArm=null; renderStudio(); } },4000); return; }
    STU.delArm=null; stuStop(); stuSnap(); p.lines.splice(i,1); save(); renderStudio(); toast('Line deleted. Ctrl+Z brings it back.'); return; }
}
function stuClick(e){
  const ch=e.target.closest('[data-stuvoice]'); if(ch){ STU.sel=ch.dataset.stuvoice; renderStudio(); return; }
  const gp=e.target.closest('[data-stugap]'); if(gp){ const l=stuProj().lines.find(x=>x.id===gp.dataset.stugap); if(l){ stuSnap(); l.gap=+gp.dataset.g; save(); renderStudio(); } return; }
  const la=e.target.closest('[data-stul]'); if(la){ const ln=la.closest('[data-lid]'); if(ln) stuLineAct(la.dataset.stul,ln.dataset.lid); return; }
  const b=e.target.closest('[data-stu]'); if(!b) return; const a=b.dataset.stu, p=stuProj();
  if(a==='rec') stuRecStart(STU.sel); else if(a==='recstop') stuRecStop(); else if(a==='reccancel') stuRecStop(true);
  else if(a==='playall'){ if(STU.play) stuStop(); else stuPlay(null); }
  else if(a==='copy') stuExport(true); else if(a==='save') stuExport(false);
  else if(a==='undo') stuUndo(false); else if(a==='redo') stuUndo(true);

  else if(a==='delproj'&&p){ if(STU.delArm!=='proj'){ STU.delArm='proj'; renderStudio(); setTimeout(()=>{ if(STU.delArm==='proj'){ STU.delArm=null; renderStudio(); } },4000); return; }
    STU.delArm=null; stuStop(); const c=stuCfg(); c.projects=c.projects.filter(x=>x.id!==p.id); c.cur=c.projects[0]?c.projects[0].id:null; p.lines.forEach(l=>STU.buf.delete(l.id)); APP.studio({op:'deleteProject',pid:p.id}); save(); toast('Conversation deleted'); renderStudio(); }

  const ac=new AudioContext(), an=ac.createAnalyser(); an.fftSize=2048; ac.createMediaStreamSource(new MediaStream([at])).connect(an);
  const beep=new AudioContext(), o=beep.createOscillator(), g=beep.createGain(); o.frequency.value=880; g.gain.value=0.08; o.connect(g); g.connect(beep.destination);
  const buf=new Float32Array(2048), rms=()=>{ an.getFloatTimeDomainData(buf); let s=0; for(const x of buf) s+=x*x; return Math.sqrt(s/buf.length); };
  let base=0; for(let i=0;i<5;i++){ await new Promise(r=>setTimeout(r,60)); base=Math.max(base,rms()); }
  let peak=0; o.start();

function renderSndEdit(){

function sedDraw(head){

function sedRender(){ // trimmed, faded, optionally normalized copy

var tourI=-1;
function startTour(){ tourI=0; showTour(); }
function endTour(){ tourI=-1; $('#tour').hidden=true; S.toured=true; save(); }
function showTour(){
  const st=TOUR[tourI]; if(!st){ endTour(); return; }
  if(st.view&&S.view!==st.view) setView(st.view);
  const el=document.querySelector(st.sel), w=$('#tour'), spot=$('#tourSpot'), tip=$('#tourTip'); if(!el){ tourI++; showTour(); return; }
  w.hidden=false; const r=el.getBoundingClientRect(), pad=6;
  Object.assign(spot.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
  tip.innerHTML=`<div class="tour-step">${tourI+1} of ${TOUR.length}</div><h3>${esc(st.title)}</h3><p>${esc(st.text)}</p><div class="head-acts" style="margin:0">${tourI>0?'<button class="btn small sec" data-tour="back">Back</button>':''}<button class="btn small pri" data-tour="next">${tourI===TOUR.length-1?'Done':'Next'}</button><button class="btn small sec" data-tour="skip">Skip tour</button></div>`;
  const tw=300, th=tip.offsetHeight||170; let x=r.right+16, y=r.top;
  if(x+tw>innerWidth-12){ x=Math.max(12,Math.min(innerWidth-tw-12,r.left+r.width/2-tw/2)); y=r.top-th-16; if(y<12) y=r.bottom+16; }
  y=Math.max(12,Math.min(innerHeight-th-12,y));
  Object.assign(tip.style,{left:x+'px',top:y+'px'});
}
$('#tour').addEventListener('click',e=>{ const b=e.target.closest('[data-tour]'); if(!b) return; const a=b.dataset.tour; if(a==='next'){ tourI++; showTour(); } else if(a==='back'){ tourI=Math.max(0,tourI-1); showTour(); } else endTour(); });
window.addEventListener('resize',()=>{ if(tourI>=0) showTour(); });
document.addEventListener('keydown',e=>{ if(tourI>=0&&e.key==='Escape') endTour(); });

  const out=[], seen=new Set();
  for(const raw of names||[]){ const n=String(raw).trim(); if(!n) continue; const svcs=W_NET[n.toLowerCase()]; out.push({label:n,svcs:svcs||null}); (svcs||[]).forEach(x=>seen.add(x)); }
  if(ctxt&&ctxt.league==='nfl'&&ctxt.game&&!isPrime(ctxt.game)&&etDay(ctxt.game.date)==='Sun'&&(names||[]).some(n=>/^(cbs|fox)$/i.test(n))) out.push({label:'Out of market?',svcs:['sundayticket']});
  return out;
}
function svcChips(list){
  const mine=new Set(wCfg().services); const done=new Set();
  return list.map(x=>{ let svc=(x.svcs||[]).filter(s=>!done.has(s)); svc.forEach(s=>done.add(s));
    const same=(x.svcs||[]).find(s=>svcName(s).toLowerCase()===String(x.label).toLowerCase()||s===String(x.label).toLowerCase()); const dupe=same&&!svc.includes(same); svc=svc.filter(s=>s!==same); if(dupe&&!svc.length) return '';
    return `<span class="wnet ${same&&mine.has(same)?'have':''}">${same&&mine.has(same)?'✓ ':''}${esc(x.label)}</span>${svc.map(s=>`<span class="wsvc ${mine.has(s)?'have':''}" title="${mine.has(s)?'You have this':'Streams on '+esc(svcName(s))}">${mine.has(s)?'✓ ':''}${esc(svcName(s))}</span>`).join('')}`; }).join('')||'<span class="wnet dim">TV info not out yet</span>';
}
function provChips(p){
  if(!p) return '<span class="wnet dim">Where to watch: not listed yet</span>';
  const mine=new Set(wCfg().services), mapSvc=n=>{ const s=W_SERVICES.find(x=>x[2].test(n)); return s?s[0]:null; };

}

async function wCollect(force){
  if(W.collecting) return W.collect; W.collecting=true; W.loading++; if(S.view==='watch') renderWatch();
  const c=wCfg(), items=new Map(), errs=[], now=Date.now(), from=now-10*864e5, to=now+60*864e5;
  const add=x=>{ const prev=items.get(x.id); if(prev){ if(!prev.odds&&x.odds) prev.odds=x.odds; if(x.state!=='pre'||!prev.broadcasts.length) Object.assign(prev,{state:x.state,completed:x.completed,detail:x.detail,home:x.home,away:x.away,broadcasts:prev.broadcasts.length?prev.broadcasts:x.broadcasts}); } else items.set(x.id,x); };
  const jobs=[];
  for(const [lg] of W_LEAGUES){
    const teams=(c.teams[lg]||[]), wantAll=!!c.all[lg], wantPrime=lg==='nfl'&&c.primetime;
    if(!teams.length&&!wantAll&&!wantPrime) continue;
    jobs.push((async()=>{
      try{ const bd=await wcall({op:'scoreboard',league:lg,from:now-8*864e5,to:now+16*864e5}); W.board[lg]=bd;
        for(const g of bd){ const mine=teams.includes(g.home&&g.home.id)||teams.includes(g.away&&g.away.id); if(mine||wantAll||(wantPrime&&isPrime(g))) add(Object.assign({},g,{mine,prime:isPrime(g)})); } }
      catch(e){ errs.push(W_LEAGUES.find(x=>x[0]===lg)[1]+' scores: '+e.message); }
      for(const t of teams){ try{ const sc=W.sched[lg+t]&&!force?W.sched[lg+t]:await wcall({op:'schedule',league:lg,team:t}); W.sched[lg+t]=sc; for(const g of sc){ const d=+new Date(g.date); if(d>from&&d<to) add(Object.assign({},g,{mine:true,prime:isPrime(g)})); } }catch(e){ errs.push('Schedule: '+e.message); } }
    })());
  }
  for(const sh of c.shows) jobs.push((async()=>{ try{ const eps=W.eps[sh.id]&&!force?W.eps[sh.id]:await wcall({op:'tvEpisodes',id:sh.id}); W.eps[sh.id]=eps;
    for(const ep of eps){ const d=+new Date(ep.airstamp||ep.airdate); if(d>from&&d<to) add({kind:'tv',id:'tv:'+ep.id,date:ep.airstamp||ep.airdate,show:sh,ep}); } }catch(e){ errs.push(sh.name+': '+e.message); } })());
  if(fightOn()) jobs.push((async()=>{ try{ for(const x of await wFights()){ const d=+new Date(x.date); if(d>from&&d<to+60*864e5) add(x); } if(W.fightErr) errs.push(W.fightErr); }catch(e){ errs.push('Fights: '+e.message); } })());
  for(const g of vgSeed()) if(g.date){ const d=+new Date(g.date+'T12:00:00'); if(d>from&&d<to+400*864e5) add({kind:'vg',id:'vg:'+g.id,date:g.date+'T12:00:00',vg:g}); }
  for(const m of c.movies){ if(m.date){ const d=+new Date(m.date+'T12:00:00'); if(d>from&&d<to+120*864e5) add({kind:'movie',id:'m:'+m.id,date:m.date+'T12:00:00',movie:m}); } }
  if(stX().earn&&APP&&APP.more){ const syms=[...new Set(stX().list.concat(stX().hold.map(h=>h.sym)))].filter(x=>!/^\^|=|-USD$/.test(x)); if(syms.length) jobs.push((async()=>{ try{ const r=await mcall({op:'earnings',symbols:syms}); STK.earn=r; STK.earnAt=Date.now(); for(const e of r){ if(e.date>from&&e.date<to+60*864e5) add({kind:'earn',id:'earn:'+e.symbol+':'+dayKey(e.date),date:new Date(new Date(e.date).setHours(12,0,0,0)).toISOString(),earn:e}); } }catch(e){ errs.push('Earnings: '+e.message); } })()); }
  await Promise.all(jobs);
  W.collect=[...items.values()].sort((a,b)=>new Date(a.date)-new Date(b.date)); W.err=errs.slice(0,3).join(' · ');
  W.collecting=false; W.stale=false; W.loading--; if(W.collect.length) cacheSave('watch',W.collect); try{ pushTray(); reminderTick(); lineTick(); wtwTick(); }catch(e){ errLog('watch',e); } if(S.view==='watch') renderWatch(); return W.collect;
}

const fmtTime=d=>new Date(d).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const dayKey=d=>{ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };

function wShowCard(sh,following){
  const c=wCfg(), id=String(sh.id), fol=c.shows.some(x=>String(x.id)===id), net=(sh.webChannel&&sh.webChannel.name)||(sh.network&&sh.network.name)||sh.net||'', imdb=(sh.externals||{}).imdb, r=W.rate[imdb];
  const next=sh._embedded&&sh._embedded.nextepisode, prev=sh._embedded&&sh._embedded.previousepisode, img=(sh.image&&(sh.image.medium||sh.image))||'';
  if(following&&!W.show[id]&&!W['ld'+id]){ W['ld'+id]=1; wcall({op:'tvShow',id}).then(x=>{ W.show[id]=x; renderWatch(); }).catch(()=>{}); }
  if(imdb&&W.keys&&W.keys.omdb&&!(imdb in W.rate)){ W.rate[imdb]=null; wcall({op:'ratings',imdb}).then(x=>{ W.rate[imdb]=x; renderWatch(); }).catch(e=>{ W.rate[imdb]={error:e.message}; }); }
  return `<div class="wscard"><div class="wposter" style="${typeof img==='string'&&img?`background-image:url('${esc(img)}')`:''}"></div><div class="wmain"><b>${esc(sh.name)}</b>
    <div class="wsub">${[net,(sh.rating&&sh.rating.average)?'TVmaze '+sh.rating.average:'',sh.status&&sh.status!=='Running'?sh.status:''].filter(Boolean).map(esc).join(' · ')}</div>${ratingBadges(r)}
    ${next?`<div class="wsub">Next: ${new Date(next.airstamp||next.airdate).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})} · S${next.season}E${next.number}</div>`:following&&prev?`<div class="wsub">Last aired ${new Date(prev.airstamp||prev.airdate).toLocaleDateString()}</div>`:''}
    <div class="wchips">${svcChips(watchFor(net?[net]:[]))}</div>
    <button class="btn small ${fol?'sec':'pri'}" data-wshow="${esc(id)}" data-name="${esc(sh.name)}" data-img="${esc(typeof img==='string'?img:'')}" data-net="${esc(net)}">${fol?'Following ✓':'+ Follow'}</button></div></div>`;
}
function wMovieTile(m){
  const c=wCfg(), det=W.mdet[m.tmdb], inList=c.movies.some(x=>x.id===m.tmdb);
  if(!det&&!W['md'+m.tmdb]){ W['md'+m.tmdb]=1; wQueue(()=>wcall({op:'movieDetail',id:m.tmdb}).then(d=>{ W.mdet[m.tmdb]=d; if(wCfg().recOnly&&wCfg().tab==='movies') renderWatch(); else wPaintMovie(m.tmdb); }).catch(()=>{ W.mdet[m.tmdb]={}; })); }
  return `<div class="wmtile" data-mtile="${m.tmdb}"><div class="wposter big" style="${m.poster?`background-image:url('${esc(m.poster)}')`:''}"></div><div class="wmt-body"><b>${esc(m.title)}</b><small>${m.date?new Date(m.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):''}</small>
    <div class="wmt-rate">${det?ratingBadges(det.ratings):'<span class="wrate dim">…</span>'}</div><div class="wchips">${det?(m.date&&new Date(m.date+'T12:00:00')>Date.now()&&!(det.providers&&det.providers.stream.length)?'<span class="wnet">In theaters '+new Date(m.date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span>':provChips(det.providers)):''}</div>
    <button class="btn small ${inList?'sec':'pri'}" data-wmovie="${m.tmdb}">${inList?'On calendar ✓':'+ Calendar'}</button></div></div>`;
}
function wPaintMovie(id){ const el=document.querySelector(`[data-mtile="${id}"]`); const m=(W.movies||[]).find(x=>x.tmdb===id); if(el&&m){ const t=document.createElement('div'); t.innerHTML=wMovieTile(m); el.replaceWith(t.firstElementChild); } }
var wq=[], wqn=0; function wQueue(fn){ wq.push(fn); wPump(); } function wPump(){ while(wqn<4&&wq.length){ wqn++; wq.shift()().finally(()=>{ wqn--; wPump(); }); } }
async function wMovies(reset){ if(reset){ W.mpage=1; W.movies=[]; } W.mloading=true; renderWatch();
  try{ const r=await wcall({op:'movies',list:W.mlist,page:W.mpage}); W.movies=(W.movies||[]).concat(r.items); W.mmore=r.more; }catch(e){ W.err=e.message; if(e.message==='NO_TMDB') W.keys=Object.assign({},W.keys,{tmdb:false}); }
  W.mloading=false; renderWatch(); }
async function wTvRec(){
  W.tvrecLoading=true; const seen=new Map();
  try{ for(let i=0;i<7;i++){ const d=new Date(Date.now()+i*864e5), ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); const list=await wcall({op:'tvSchedule',date:ds});
      for(const ep of list){ const sh=(ep._embedded&&ep._embedded.show)||ep.show; if(!sh||seen.has(sh.id)) continue; if(sh.language&&sh.language!=='English') continue; seen.set(sh.id,sh); } } }catch(e){ W.err='TV: '+e.message; }
  W.tvrec=[...seen.values()].filter(sh=>!/news|talk show/i.test(sh.type||'')).sort((a,b)=>((b.rating&&b.rating.average)||0)+(b.weight||0)/100-((a.rating&&a.rating.average)||0)-(a.weight||0)/100).slice(0,40);
  W.tvrecLoading=false; renderWatch();
}
function wBind(){
  const v=$('#view-watch'), c=wCfg();
  const pr=$('#wPrime'); if(pr) pr.onchange=()=>{ c.primetime=pr.checked; save(); W.collect=null; wCollect(); };
  const ps=$('#wPrimeSw'); if(ps) ps.onclick=()=>{ c.primetime=!c.primetime; save(); W.collect=null; renderWatch(); };
  const as=$('#wAllSw'); if(as) as.onclick=()=>{ c.all[c.league]=!c.all[c.league]; save(); W.collect=null; renderWatch(); };
  const ro=$('#wRecOnly'); if(ro) ro.onchange=()=>{ c.recOnly=ro.checked; save(); renderWatch(); };
  const tf=$('#wTvForm'); if(tf) tf.onsubmit=async e=>{ e.preventDefault(); W.tvq=$('#wTvQ').value.trim(); if(!W.tvq) return; try{ W.tvres=await wcall({op:'tvSearch',q:W.tvq}); }catch(err){ W.tvres=[]; toast(err.message); } renderWatch(); };
  v.querySelectorAll('[data-wsvc]').forEach(b=>b.onchange=()=>{ const id=b.dataset.wsvc; c.services=b.checked?[...new Set(c.services.concat(id))]:c.services.filter(x=>x!==id); save(); });
  bindFader('wMinImdb',M(5,9,0.1,x=>(+x).toFixed(1)),x=>{ c.minImdb=Math.round(x*10)/10; save(); });
  bindFader('wMinRt',M(40,100,5,x=>x+'%'),x=>{ c.minRt=x; save(); });
}
$('#view-watch').addEventListener('click',async e=>{

  const a=t.closest('[data-wact]'); if(!a) return;
  switch(a.dataset.wact){

    case 'vgmore': WG.page++; wGamesLoad(true); break;

    case 'savetmdb': { const val=$('#wTmdb').value.trim(); W.keys=await wcall({op:'keys',tmdb:val}); W.movies=null; toast(val?'TMDB key saved':'TMDB key removed'); renderWatch(); break; }
    case 'saveomdb': { const val=$('#wOmdb').value.trim(); W.keys=await wcall({op:'keys',omdb:val}); W.rate={}; W.mdet={}; toast(val?'OMDb key saved':'OMDb key removed'); renderWatch(); break; }
    case 'testkeys': { const el=$('#wKeyTest'); el.textContent='Testing…'; const r=await APP.watch({op:'testKeys'}), g=await APP.games({op:'testKeys'}); el.textContent=[g.rawg===true?'RAWG ✓':g.rawg===false?(g.rawgErr||'RAWG ✕'):null,r.tmdb===true?'TMDB ✓':r.tmdb===false?(r.tmdbErr||'TMDB ✕'):'No TMDB key',r.omdb===true?'OMDb ✓':r.omdb===false?(r.omdbErr||'OMDb ✕'):'No OMDb key',r.odds===true?'Odds API ✓':r.odds===false?(r.oddsErr||'Odds API ✕'):null].filter(Boolean).join(' · '); break; }
  }
});

  if(g.xbox) out.push(['Xbox',`https://www.xbox.com/en-US/games/store/p/${g.xbox}`]); else if((g.platforms||[]).some(p=>/xbox/i.test(p))) out.push(['Xbox',`https://www.xbox.com/en-US/search?q=${t}`]);
  if((g.platforms||[]).some(p=>/playstation|ps5|ps4/i.test(p))) out.push(['PlayStation',`https://store.playstation.com/en-us/search/${t}`]);
  if((g.platforms||[]).some(p=>/nintendo|switch/i.test(p))) out.push(['Nintendo',`https://www.nintendo.com/us/search/#q=${t}`]);
  return out.map(([n,u])=>`<a href="#" class="wsvc" data-wlink="${esc(u)}">${n}</a>`).join(''); }

/* ---- Betting lines: spread, over/under, moneyline, and who covered ---- */
var wOddsCache={};
function oddsHtml(g){
  const o=g.odds||wOddsCache[g.id];
  if(!o){ if(g.state==='pre'&&g.kind==='game'){ wOddsFetch(g); return `<span class="wodds dim">Line not posted yet</span>`; } return ''; }
  const parts=[];
  if(o.details) parts.push(`<span class="wline"><em>Spread</em><b>${esc(o.details)}</b></span>`);
  if(o.overUnder!=null) parts.push(`<span class="wline"><em>O/U</em><b>${esc(o.overUnder)}</b></span>`);
  if(o.mlAway||o.mlHome) parts.push(`<span class="wline"><em>Moneyline</em><b>${esc((g.away&&g.away.abbr)||o.awayAbbr||'Away')} ${esc(o.mlAway||'—')} · ${esc((g.home&&g.home.abbr)||o.homeAbbr||'Home')} ${esc(o.mlHome||'—')}</b></span>`);
  if(g.state==='post'&&g.home&&g.away&&g.home.score!=null&&g.away.score!=null){
    const hs=+g.home.score, as=+g.away.score, m=/^([A-Z0-9]+)\s*([-+]?\d+(?:\.\d+)?)/i.exec(o.details||'');
    if(m){ const fav=m[1].toUpperCase(), line=+m[2], favHome=fav===String(g.home.abbr||'').toUpperCase(), margin=(favHome?hs-as:as-hs)+line;
      const dog=favHome?g.away.abbr:g.home.abbr; parts.push(`<span class="wline res"><em>ATS</em><b>${margin>0?esc(fav)+' covered':margin<0?esc(dog)+' covered':'Push'}</b></span>`); }
    else if(/even|pk|pick/i.test(o.details||'')){ parts.push(`<span class="wline res"><em>ATS</em><b>${hs===as?'Push':esc((hs>as?g.home:g.away).abbr)+' covered'}</b></span>`); }
    if(o.overUnder!=null){ const t=hs+as; parts.push(`<span class="wline res"><em>Total ${t}</em><b>${t>o.overUnder?'Over':t<o.overUnder?'Under':'Push'}</b></span>`); }
  }
  return parts.length?`<span class="wodds" title="${esc(o.provider||'Betting line')}">${parts.join('')}</span>`:'';
}
var wOddsSeen={};
function wOddsFetch(g){ if(!g.eid||wOddsSeen[g.id]) return; const d=+new Date(g.date); if(d-Date.now()>10*864e5||d<Date.now()-6*3600e3) return; wOddsSeen[g.id]=1;
  wQueue(()=>wcall({op:'odds',league:g.league,eid:g.eid}).then(o=>{ if(!o||o.error) return; wOddsCache[g.id]=o; for(const list of [W.collect||[]].concat(Object.values(W.board||{})).concat(Object.values(W.sched||{}))) for(const x of list) if(x.id===g.id) x.odds=o; clearTimeout(wOddsFetch.t); wOddsFetch.t=setTimeout(()=>{ if(S.view==='watch') renderWatch(); },300); }).catch(()=>{})); }
