<!doctype html>
<html><head><meta charset="utf-8"><title>Arcade test</title>
<link rel="stylesheet" href="../fonts.css">
<style>
:root{
  --bg:#0e0c0b; --rail:#141110; --panel:#1a1614; --panel2:#24201c; --line:#332d28;
  --fg:#f3ece5; --muted:#a3968a; --dim:#6f655c;
  --ember:#ff8a3d; --ember-ink:#1b0d03; --gold:#ffc861; --cool:#6fd3c7; --bad:#ff5a52; --ok:#4ade80;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding:24px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.btn{height:40px;padding:0 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--ember);color:var(--ember-ink)}
.btn.sec{background:var(--panel2);border:1px solid var(--line)}
.btn.small{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--muted);font-size:13px}
#box{max-width:1100px}
</style></head>
<body>
<div id="box"></div>
<script>
const q=new URLSearchParams(location.search), id=q.get('g');
const store={};
const api={ load:k=>store[id+':'+k]??null, save:(k,v)=>{ store[id+':'+k]=JSON.parse(JSON.stringify(v)); }, sound:true, toast:m=>console.log('TOAST',m) };
window.VanArcade=window.VanArcade||{};
const s=document.createElement('script'); s.src=id+'.js'; s.onload=()=>{ VanArcade[id].mount(document.getElementById('box'),api); window.__mounted=true; };
s.onerror=()=>console.error('load failed'); document.head.appendChild(s);
</script>
</body></html>
