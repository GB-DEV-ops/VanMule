/* ================= Reminders, Google Calendar, .ics export, tray "Coming up" ================= */
function rCfg(){ const c=wCfg(); if(!c.remind) c.remind={lead:30,teams:true,prime:false,fights:true,tv:false,releases:true,finals:false,pins:{},fired:{}}; const r=c.remind; if(!r.pins) r.pins={}; if(!r.fired) r.fired={}; return r; }
const ovKeyLabel=()=>S.keys&&S.keys.overlayToggle?S.keys.overlayToggle:'';
function evTitle(x){
  if(x.kind==='game') return `${(x.away||{}).short||(x.away||{}).name||''} ${x.neutral?'vs':'@'} ${(x.home||{}).short||(x.home||{}).name||''}`;
  if(x.kind==='tv') return `${x.show.name} S${x.ep.season}E${x.ep.number}`;
  if(x.kind==='movie') return `${x.movie.title} (in theaters)`;
  if(x.kind==='vg') return `${x.vg.title} release`;
  if(x.kind==='earn') return `${x.earn.symbol} earnings`;
  if(x.kind==='fight') return x.sport==='ufc'?(x.main?`${x.name}: ${x.main.a.name} vs ${x.main.b.name}`:x.name):`${x.a} vs ${x.b}`;
  return 'Event';
}
const allDay=x=>x.kind==='movie'||x.kind==='vg'||x.kind==='earn';
function evDetails(x){
  const d=[];
  if(x.kind==='game'){ const L=(W_LEAGUES.find(l=>l[0]===x.league)||[])[1]||''; d.push(L+(x.week?' · '+x.week:'')); const o=x.odds||wOddsCache[x.id]; if(o&&o.details) d.push('Spread '+o.details+(o.overUnder!=null?' · O/U '+o.overUnder:'')); if(x.broadcasts&&x.broadcasts.length) d.push('TV: '+x.broadcasts.join(', ')); }
  if(x.kind==='tv'){ if(x.ep.name) d.push(x.ep.name); if(x.show.net) d.push('On '+x.show.net); }
  if(x.kind==='fight'){ if(x.main&&x.main.weight) d.push(x.main.weight); if(x.broadcasts&&x.broadcasts.length) d.push('TV: '+x.broadcasts.join(', ')); if(x.mlA||x.mlB) d.push(`Moneyline: ${x.a} ${x.mlA||'—'}, ${x.b} ${x.mlB||'—'}`); }
  if(x.kind==='vg'&&x.vg.platforms) d.push((x.vg.platforms||[]).join(', '));
  d.push('From the VanMule Watch calendar'); return d.filter(Boolean).join('\n');
}
function evLocation(x){ const v=x.venue; return v&&v.name?`${v.name}${v.city?', '+v.city:''}${v.state?', '+v.state:''}`:''; }
const evLen=x=>x.kind==='game'?3*3600e3:x.kind==='fight'?(x.sport==='ufc'?5:3)*3600e3:x.kind==='tv'?3600e3:3*3600e3;
const gStamp=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const gDay=d=>{ const x=new Date(d); return x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0'); };
function gcalUrl(x){
  const st=+new Date(x.date), dates=allDay(x)?`${gDay(st)}/${gDay(st+864e5)}`:`${gStamp(st)}/${gStamp(st+evLen(x))}`;
  const q=new URLSearchParams({action:'TEMPLATE',text:evTitle(x),dates,details:evDetails(x)}); const loc=evLocation(x); if(loc) q.set('location',loc);
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function icsText(items){
  const esc_=t=>String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VanMule//Watch//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:VanMule Watch'];
  for(const x of items){ const st=+new Date(x.date);
    L.push('BEGIN:VEVENT','UID:'+String(x.id).replace(/[^\w:.-]/g,'')+'@vanmule','DTSTAMP:'+gStamp(Date.now()),
      ...(allDay(x)?['DTSTART;VALUE=DATE:'+gDay(st),'DTEND;VALUE=DATE:'+gDay(st+864e5)]:['DTSTART:'+gStamp(st),'DTEND:'+gStamp(st+evLen(x))]),
      'SUMMARY:'+esc_(evTitle(x)),'DESCRIPTION:'+esc_(evDetails(x)),...(evLocation(x)?['LOCATION:'+esc_(evLocation(x))]:[]),
      ...(!allDay(x)&&rCfg().lead?['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc_(evTitle(x)),'TRIGGER:-PT'+rCfg().lead+'M','END:VALARM']:[]),'END:VEVENT'); }
  L.push('END:VCALENDAR'); return L.join('\r\n');
}
function icsExport(){
  const items=(W.collect||[]).filter(x=>+new Date(x.date)>Date.now()-3600e3);
  if(!items.length){ toast('Nothing upcoming to export yet'); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([icsText(items)],{type:'text/calendar'})); a.download='VanMule calendar.ics'; document.body.appendChild(a); a.click(); a.remove();
  toast(`Exported ${items.length} events. In Google Calendar: Settings → Import & export → Import.`);
}
function wantsReminder(x){
  const r=rCfg(), pin=r.pins[x.id]; if(pin===true) return true; if(pin===false) return false; if(!r.lead) return false;
  if(x.kind==='game') return (r.teams&&x.mine)||(r.prime&&x.prime);
  if(x.kind==='earn') return !!r.earn; if(x.kind==='fight') return r.fights; if(x.kind==='tv') return r.tv; if(x.kind==='movie'||x.kind==='vg') return r.releases; return false;
}

const calBtn=x=>`<a href="#" class="wcalbtn" data-wlink="${esc(gcalUrl(x))}" title="Add to Google Calendar">📅 Google Calendar</a>`;
function notify(title,body){ toast(title+(body?' — '+body:'')); try{ new Notification(title,{body:body||'',silent:false}); }catch{} }
var lastStates={};
function reminderTick(){
  const r=rCfg(), now=Date.now(); if(!W.collect) return;
  for(const x of W.collect){
    const st=+new Date(x.date), leadMs=(r.lead||15)*60e3;
    if(wantsReminder(x)&&!r.fired[x.id]){
      const when=allDay(x)?+new Date(new Date(x.date).setHours(9,0,0,0)):st-leadMs;
      if(now>=when&&now<st+(allDay(x)?14*3600e3:15*60e3)){ r.fired[x.id]=now; save();
        const o=x.kind==='game'?(x.odds||wOddsCache[x.id]):null;
        hookSend('reminders',`⏰ ${allDay(x)?evTitle(x)+' today':evTitle(x)+' at '+fmtTime(x.date)}`);

      const pcm=await toMono48(await new Blob(chunks,{type:rec.mimeType||'audio/webm'}).arrayBuffer()), {data,ext}=await vmEncode(vmTrim(pcm,SR),SR);

const PAD={raf:0,down:{},rep:{}};
const PAD_MAP=[['ArrowUp','ArrowUp',38],['ArrowDown','ArrowDown',40],['ArrowLeft','ArrowLeft',37],['ArrowRight','ArrowRight',39],[' ','Space',32],['x','KeyX',88],['z','KeyZ',90],['c','KeyC',67],['Enter','Enter',13],['p','KeyP',80],['q','KeyQ',81],['e','KeyE',69]];
function padConnected(){ try{ return [...(navigator.getGamepads?navigator.getGamepads():[])].some(Boolean); }catch{ return false; } }
function padKey(type,i,repeat){ const [key,code,kc]=PAD_MAP[i]; const ev=new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true,repeat:!!repeat}); try{ Object.defineProperty(ev,'keyCode',{get:()=>kc}); Object.defineProperty(ev,'which',{get:()=>kc}); }catch{} (document.activeElement&&document.activeElement!==document.body?document.activeElement:window).dispatchEvent(ev); }
function padRelease(){ for(const i in PAD.down) if(PAD.down[i]) padKey('keyup',+i); PAD.down={}; PAD.rep={}; }
function padStart(){ if(!PAD.raf&&padConnected()) PAD.raf=requestAnimationFrame(padLoop); }
function padLoop(){ PAD.raf=0; const gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);
  if(!gp){ padRelease(); return; }
  if(document.hidden||S.view!=='arcade'||!ARC.cur){ padRelease(); return; }   // restarted when you come back (renderArcade)
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed), ax=i=>gp.axes[i]||0;
  const st=[b(12)||ax(1)<-.55, b(13)||ax(1)>.55, b(14)||ax(0)<-.55, b(15)||ax(0)>.55, b(0), b(1), b(2), b(3), b(9), b(8), b(4), b(5)], now=performance.now();
  st.forEach((on,i)=>{ if(on&&!PAD.down[i]){ PAD.down[i]=true; PAD.rep[i]=now+380; padKey('keydown',i); } else if(!on&&PAD.down[i]){ PAD.down[i]=false; padKey('keyup',i); } else if(on&&i<4&&now>PAD.rep[i]){ PAD.rep[i]=now+95; padKey('keydown',i,true); } });
  PAD.raf=requestAnimationFrame(padLoop); }

        ${iss?`<p class="pcwarn">⚠ ${esc(iss)}</p><button class="btn small sec" data-pc="ignore1" data-dk="${esc(d.dev+'|'+d.w+'x'+d.h+'@'+d.hz)}" style="margin-top:6px">Ignore for this screen</button>`:'<p class="pcok">✓ Looks right</p>'}</div></div>`; }).join('')||'<p class="note">No screens found.</p>'}</div>
      <div class="setlist" style="margin-top:12px"><div class="setrow"><div><b>Warn me about screen settings</b><p>Shows a banner when a screen is below its best refresh rate or resolution.${Object.keys(pcCfg().dispDismiss).length?` You've ignored ${Object.keys(pcCfg().dispDismiss).length} warning${Object.keys(pcCfg().dispDismiss).length>1?'s':''}.`:''}</p></div>${Object.keys(pcCfg().dispDismiss).length?'<button class="btn small sec" data-pc="unignore">Show ignored again</button>':''}${sw('pcDispOn',!pcCfg().dispOff,'Warn me about screen settings')}</div></div>

    <div class="seg" style="margin-bottom:18px">${tabs.map(([k,n])=>`<button data-pctab="${k}" aria-pressed="${tab===k}">${n}</button>`).join('')}</div>${body}`;
}
function pcFixStepsHtml(){ return `<details class="chhelp" open><summary>How to fix a 60 Hz cap or the wrong resolution</summary><div class="note">
  <p><b>Refresh rate (Hz):</b></p><ol><li>Click <b>Open Windows display settings</b> above (Settings → System → Display → Advanced display).</li><li>Pick the right screen at the top under "Select a display".</li><li>Under <b>Choose a refresh rate</b>, pick the highest number (for example 144 Hz, 165 Hz or 240 Hz).</li><li>Windows 10: Settings → System → Display → Advanced display settings → Refresh rate.</li></ol>
  <p><b>Resolution:</b> Settings → System → Display → <b>Display resolution</b> → choose the one marked <b>(Recommended)</b>. If you play stretched on purpose, you can ignore this.</p>
  <p><b>The higher number isn't in the list?</b></p><ul><li>Use a <b>DisplayPort</b> cable, or an HDMI 2.0+ cable, plugged into the <b>graphics card</b> (not the motherboard's port).</li><li>Turn on the monitor's overclock/high refresh option in its on-screen menu if it has one.</li><li>Update your graphics driver. NVIDIA: right-click the desktop → NVIDIA Control Panel → Change resolution → Refresh rate. AMD: Adrenalin → Display.</li><li>Turn off "Dynamic refresh rate" if games feel capped on a laptop.</li></ul></div></details>`; }
function dispLabel(d,i){ const n=(/DISPLAY(\d+)/i.exec(d.dev||'')||[])[1]; const nm=d.name||(/generic|pnp/i.test(d.mon||'')?'':d.mon)||''; return (nm?nm+' ':'')+(n?`(Display ${n})`:nm?'':`Screen ${(i||0)+1}`); }
function pcDispIssue(d){ if(!d) return ''; const k=d.dev+'|'+d.w+'x'+d.h+'@'+d.hz; if(pcCfg().dispDismiss[k]) return '';
  if(d.maxHz&&d.maxHz>=d.hz+10) return `${dispLabel(d)}: supports ${d.maxHz} Hz but Windows has it at ${d.hz} Hz. Games can't go above ${d.hz} FPS on that screen.`;
  // resolution: only compare with the monitor's own native resolution (EDID), turned the same way as the screen
  if(d.nativeW&&d.nativeH){ const cur=[d.w,d.h].sort((a,b)=>b-a), nat=[d.nativeW,d.nativeH].sort((a,b)=>b-a);
    if(cur[0]<nat[0]*0.9&&cur[1]<nat[1]*0.9){ const nw=d.w>=d.h?nat[0]:nat[1], nh=d.w>=d.h?nat[1]:nat[0]; return `${dispLabel(d)}: running at ${d.w}×${d.h}, below its native ${nw}×${nh}. Text and games look blurrier.`; } }
  return ''; }
function pcDispIssues(){ return ((PCX.disp&&PCX.disp.displays)||[]).map(pcDispIssue).filter(Boolean); }
async function pcDispLoad(quiet){ PCX.dispLoading=true; try{ PCX.disp=await pcCall({op:'display'}); }catch(e){ PCX.disp={displays:[],error:e.message}; } PCX.dispLoading=false; pcBanner(); if(S.view==='pc') renderPc(); }
/* the banner at the top of every page */
function pcBanner(){ let b=$('#pcBanner'); const iss=pcCfg().dispOff?[]:pcDispIssues(); if(!iss.length){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement('div'); b.id='pcBanner'; b.className='pcbanner'; const sc=$('#scroll'); sc.parentNode.insertBefore(b,sc); }
  b.innerHTML=`<span class="pcb-ico">⚡</span><div><b>Performance: your screen isn't at its best setting</b><span>${esc(iss[0])}</span></div><button class="btn small pri" data-pc="opendisp">Fix it in Windows</button><button class="btn small sec" data-pc="howdisp">Show me how</button><button class="btn small sec" data-pc="dismissdisp" title="Hide this warning for this screen and setting">Ignore</button><button class="btn small sec" data-pc="dispoff" title="Stop checking screens">Don't check screens</button>`; }
document.addEventListener('click',e=>{ const b=e.target.closest('#pcBanner [data-pc]'); if(!b) return; const k=b.dataset.pc;
  if(k==='opendisp') pcCall({op:'openDisplaySettings'}).catch(()=>{});
  if(k==='howdisp'){ pcCfg().tab='screen'; save(); setView('pc'); }
  if(k==='dispoff'){ pcCfg().dispOff=true; save(); pcBanner(); toast('Screen checks are off. Turn them back on under PC & performance → Screen check.'); return; }
  if(k==='dismissdisp'){ for(const d of (PCX.disp&&PCX.disp.displays)||[]) if(pcDispIssue(d)) pcCfg().dispDismiss[d.dev+'|'+d.w+'x'+d.h+'@'+d.hz]=1; save(); pcBanner(); toast('Hidden. The Screen check tab under PC & performance still shows it.'); } },true);
setTimeout(()=>{ if(APP&&APP.pc&&/Win/.test(navigator.platform||navigator.userAgent)) pcDispLoad(true); },45000);
/* mixer in the page */
function pcMixHtml(){ const m=PCX.mix; if(!m) return '<div class="wizrow"><div class="spin"></div></div>'; if(m.error) return `<p class="note danger">${esc(m.error)}</p>`;
  const row=(a,master)=>{ const v=Math.round((a.vol||0)*100); return `<div class="pcmrow ${a.mute?'muted':''}" data-mk="${master?'master':a.pid}"><div class="pcmico">${master?'🔈':a.icon?`<img src="${a.icon}" alt="">`:a.sys?'🔔':'🎵'}</div><div class="pcmname">${esc(master?'Master volume'+(m.dev?' · '+m.dev:''):a.label)}${!master&&a.state===1?' <small>playing</small>':''}</div>
    <button class="ib" data-mmute title="${a.mute?'Unmute':'Mute'}">${a.mute?'🔇':'🔊'}</button><input type="range" min="0" max="100" value="${v}" data-mvol><span class="pcmpct">${a.mute?'muted':v}</span></div>`; };
  return row({vol:m.vol,mute:m.mute},true)+(m.apps||[]).map(a=>row(a)).join('')+(m.demo?'<p class="note">Demo data (the real mixer works on Windows).</p>':''); }
async function pcMixLoad(){ try{ PCX.mix=await pcCall({op:'mixer'}); }catch(e){ PCX.mix={error:e.message}; } const el=$('#pcMix'); if(el&&!PCX.mixDrag) el.innerHTML=pcMixHtml(); }
async function pcMixSet(k,patch){ const m=PCX.mix; if(!m) return; const a=k==='master'?{master:true}:(m.apps||[]).find(x=>String(x.pid)===k); if(!a) return; let r=null;
  for(const pid of a.master?[0]:(a.pids||[a.pid])) r=await pcCall(Object.assign({op:'mixSet',pid,sys:!!a.sys,master:!!a.master},patch)).catch(e=>({error:e.message}));
  if(r&&!r.error){ PCX.mix=r; if(!PCX.mixDrag){ const el=$('#pcMix'); if(el) el.innerHTML=pcMixHtml(); } } }
/* my build */
async function pcBuildLoad(){ PCX.buildLoading=true; PCX.buildErr=''; if(S.view==='pc') renderPc(); try{ PCX.build=await pcCall({op:'build'}); if(!PCX.disp) pcDispLoad(true); }catch(e){ PCX.buildErr=e.message; } PCX.buildLoading=false; if(S.view==='pc') renderPc(); }
function pcBuildRows(){ const b=PCX.build||{}, rows=[], gb=x=>x?Math.round(x/1073741824)+' GB':'', tb=x=>x>=1e12?(x/1e12).toFixed(x>=1e13?0:1)+' TB':Math.round(x/1e9)+' GB';
  const model=[b.maker,b.model].filter(x=>x&&!/system manufacturer|system product name|to be filled|default string/i.test(x)).join(' ');
  if(model) rows.push(['PC model',model]);
  for(const c of b.cpu||[]) rows.push(['CPU',`${c.name}${c.cores?` (${c.cores} cores / ${c.threads} threads)`:''}`]);
  for(const g of (b.gpu||[]).filter(g=>!/basic display|remote display|virtual|parsec|meta/i.test(g.name))) rows.push(['Graphics card',`${g.name}${g.vram?' · '+gb(g.vram)+' VRAM':''}${g.driver?' · driver '+g.driver:''}`]);
  const mods=b.ram||[]; if(b.ramTotal||mods.length){ const sp=mods[0]&&(mods[0].cfg||mods[0].speed); const same=mods.length&&mods.every(m=>m.size===mods[0].size); rows.push(['RAM',`${gb(mods.reduce((a,m)=>a+(+m.size||0),0)||b.ramTotal)}${mods.length?` (${same?mods.length+'×'+gb(mods[0].size):mods.map(m=>gb(m.size)).join(' + ')})`:''}${sp?' @ '+sp+' MT/s':''}${mods[0]&&mods[0].part?' · '+[mods[0].maker,mods[0].part].filter(x=>x&&!/^0+$|unknown/i.test(x)).join(' '):''}`]); }
  if(b.board&&!/to be filled|default string/i.test(b.board)) rows.push(['Motherboard',b.board+(b.bios?' (BIOS '+b.bios+')':'')]);
  for(const d of b.disks||[]){ const type=d.bus===17?'NVMe SSD':d.media===4?'SSD':d.media===3?'HDD':''; rows.push(['Storage',`${d.name}${d.size?' · '+tb(d.size):''}${type?' · '+type:''}`]); }
  const disp=(PCX.disp&&PCX.disp.displays)||[], names=b.monitors||[];
  (disp.length?disp:names.map(n=>({mon:n}))).forEach((d,i)=>rows.push(['Monitor',`${d.name||names[i]||d.mon||'Screen '+(i+1)}${d.w?` · ${d.w}×${d.h} @ ${d.hz} Hz`:''}`]));
  if((b.audio||[]).length) rows.push(['Audio',b.audio.filter((x,i,a)=>a.indexOf(x)===i).join(', ')]);
  if((b.net||[]).length) rows.push(['Network',b.net.join(', ')]);
  if(b.os) rows.push(['Windows',b.os.replace(/^Microsoft /,'')]);
  return rows; }
function pcBuildCopy(kind){ const rows=pcBuildRows(); let t='';
  if(kind==='table') t='| Part | Details |\n|---|---|\n'+rows.map(([k,v])=>`| ${k} | ${v.replace(/\|/g,'/')} |`).join('\n');
  else if(kind==='discord'){ const w=Math.max(...rows.map(r=>r[0].length)); t='```\n'+rows.map(([k,v])=>k.padEnd(w)+'  '+v).join('\n')+'\n```'; }
  else t=rows.map(([k,v])=>`${k}: ${v}`).join('\n');
  navigator.clipboard.writeText(t).then(()=>toast('Copied your build'),()=>toast('Could not copy')); }
/* page events */

  const tb=t.closest('[data-pctab]'); if(tb){ pcCfg().tab=tb.dataset.pctab; save(); renderPc(); return; }

  if(t.closest('#pcMt')){ const r=await pcCall({op:'metrics',on:!PCX.mtOn}).catch(err=>{ toast(err.message); return null; }); if(r){ PCX.mtOn=r.on; PCX.mtCfg=r.cfg; renderPc(); try{ renderTitlebar(); }catch{} } return; }

async function stAlertTick(){ const c=stX(), live=c.alerts.filter(a=>!a.hit); if(!live.length||!APP||!APP.more) return;
  let qs=[]; try{ qs=await mcall({op:'quotes',symbols:[...new Set(live.map(a=>a.sym))]}); }catch{ return; }
  const by={}; for(const q of qs) if(q&&q.symbol&&q.price!=null){ by[q.symbol]=q; STK.quotes[q.symbol]=Object.assign(STK.quotes[q.symbol]||{},q); }
  let hit=false; for(const a of live){ const q=by[a.sym]; if(!q) continue;
    const ok=a.op==='above'?q.price>=a.v:a.op==='below'?q.price<=a.v:Math.abs(q.pct||0)>=a.v; if(!ok) continue;
    if(a.op==='move'){ const day=dayKey(Date.now()); if(a.day===day) continue; a.day=day; }
    a.hit=Date.now(); a.hitPx=q.price; hit=true;
    const msg=a.op==='move'?`${a.sym} is ${q.pct>=0?'up':'down'} ${Math.abs(q.pct).toFixed(2)}% today ($${fmtP(q.price)})`:`${a.sym} is at $${fmtP(q.price)} (alert: ${a.op} $${fmtP(a.v)})`;
    notify('📈 Stock alert',msg); if(a.hook){ const h=hCfg(); if(h.url) APP.more({op:'webhook',url:h.url,content:'📈 '+msg}).catch(()=>{}); }
    if(a.op==='move'){ a.hit=0; } }
  if(hit){ save(); if(S.view==='stocks'&&stX().pane==='alerts') stPaneRender(); } }

/* ================= 3.9 Betting: bet tracker, parlay calculator, line movement alerts ================= */
function bCfg(){ if(!S.bets) S.bets={}; return Object.assign(S.bets,Object.assign({list:[],legs:[],unit:10,show:'open'},S.bets)); }
function amDec(o){ o=+o; return o>0?1+o/100:1+100/Math.abs(o); }
function decAm(d){ return d>=2?'+'+Math.round((d-1)*100):'-'+Math.round(100/(d-1)); }
function okOdds(o){ return /^[+-]?\d{3,6}$/.test(String(o).trim())&&Math.abs(+o)>=100; }
function fmtOdds(o){ const n=+o; return n>0?'+'+n:String(n); }
function fmtLine(x){ return x>0?'+'+x:String(x); }
function betDec(b){ if(b.type==='parlay') return b.legs.filter(l=>l.status!=='push').reduce((d,l)=>d*amDec(l.odds),1); return amDec(b.odds); }
function betProfit(b){ if(b.status==='won') return b.stake*(betDec(b)-1); if(b.status==='lost') return -b.stake; return 0; }
function betResult(b,as,hs){ if(isNaN(as)||isNaN(hs)) return null;
  if(b.type==='ml'){ const me=b.side==='home'?hs:as, op=b.side==='home'?as:hs; return me>op?'won':me<op?'lost':'push'; }
  if(b.type==='spread'){ const m=(b.side==='home'?hs-as:as-hs)+b.line; return m>0?'won':m<0?'lost':'push'; }
  if(b.type==='total'){ const t=as+hs; return t===b.line?'push':(t>b.line)===(b.side==='over')?'won':'lost'; }
  return null; }
function findGame(gid){ return (W.collect||[]).concat(...Object.values(W.board||{})).find(x=>x&&x.id===gid); }
function gameLabel(g){ return `${(g.away||{}).short||(g.away||{}).abbr||''} @ ${(g.home||{}).short||(g.home||{}).abbr||''}`; }
/* the bet choices for a game, preferring DraftKings prices when they were loaded */
function betChoices(g){ const o=g.odds||wOddsCache[g.id]||{}, A=g.away||{}, H=g.home||{}, out=[], dk=BET.data[g.id]&&BET.data[g.id].line;
  const nm=t=>t.short||t.abbr||t.name||'', isH=n=>{ n=String(n||'').toLowerCase(); return !!H.name&&(n.includes(String(H.name).toLowerCase())||String(H.name).toLowerCase().includes(n)); };
  if(dk&&dk.spread) for(const x of dk.spread){ const home=isH(x.team); out.push({type:'spread',side:home?'home':'away',line:+x.point,odds:String(x.price),label:`${nm(home?H:A)} ${fmtLine(+x.point)}`}); }
  else { const m=/^([A-Z0-9]+)\s*([-+]?\d+(?:\.\d+)?)/i.exec(o.details||''); if(m){ const favHome=m[1].toUpperCase()===String(H.abbr||'').toUpperCase(), line=+m[2];
    out.push({type:'spread',side:favHome?'home':'away',line,odds:'-110',label:`${nm(favHome?H:A)} ${fmtLine(line)}`}); out.push({type:'spread',side:favHome?'away':'home',line:-line,odds:'-110',label:`${nm(favHome?A:H)} ${fmtLine(-line)}`}); } }
  if(dk&&dk.total) for(const x of dk.total){ const over=/^o/i.test(x.side); out.push({type:'total',side:over?'over':'under',line:+x.point,odds:String(x.price),label:`${over?'Over':'Under'} ${x.point}`}); }
  else if(o.overUnder!=null){ out.push({type:'total',side:'over',line:+o.overUnder,odds:'-110',label:`Over ${o.overUnder}`}); out.push({type:'total',side:'under',line:+o.overUnder,odds:'-110',label:`Under ${o.overUnder}`}); }
  if(dk&&dk.ml) for(const x of dk.ml){ const home=isH(x.team); out.push({type:'ml',side:home?'home':'away',odds:String(x.price),label:`${nm(home?H:A)} to win`}); }
  else { if(o.mlAway!=null) out.push({type:'ml',side:'away',odds:String(o.mlAway),label:`${nm(A)} to win`}); if(o.mlHome!=null) out.push({type:'ml',side:'home',odds:String(o.mlHome),label:`${nm(H)} to win`}); }
  return out.filter(x=>okOdds(x.odds)||x.odds==='-110'); }
function betBtns(g){ if(g.kind!=='game'||g.state!=='pre') return ''; const lw=xCfg().lineWatch||{}, on=!!lw[g.id];
  return `<button class="wcalbtn" data-wbet="${esc(g.id)}">💵 Track a bet</button>${(g.odds||wOddsCache[g.id])?`<button class="wcalbtn ${on?'on':''}" data-wlinew="${esc(g.id)}" title="Get a notification if the spread or total moves">${on?'📈 Watching the line':'📈 Alert me if the line moves'}</button>`:''}`; }
var BETM=null;

  vmModal(`<div class="row-between"><h2>${m.free?'Add a bet':'Track a bet'}</h2><button class="ib" data-vmm="close" aria-label="Close">${ico('x')}</button></div>
    ${m.title?`<p class="note" style="margin:0">${esc(m.title)}</p>`:''}
    ${ch.length?`<div class="betpick">${ch.map((x,i)=>`<button class="chip" data-bpick="${i}" aria-pressed="${i===m.pick}">${esc(x.label)} <small>${esc(fmtOdds(x.odds))}</small></button>`).join('')}</div>`:''}
    ${m.free||m.prop?`<label class="lbl">Bet<input class="txt" id="bmDesc" value="${esc(m.desc||'')}" placeholder="e.g. Mahomes over 2.5 passing TDs"></label>`:''}
    <div class="betrow"><label class="lbl">Odds (American)<input class="txt" id="bmOdds" value="${esc(odds)}" placeholder="-110 or +150" inputmode="numeric"></label>
      <label class="lbl">Stake ($)<input class="txt" id="bmStake" type="number" min="0" step="any" value="${esc(m.stake)}"></label>
      <div class="betwin"><small class="note">To win</small><b id="bmWin">${win!=null?usd(win):'—'}</b></div></div>
    <p class="note" style="margin:0">${ch.length&&c.odds==='-110'&&!(BET.data[m.gid]&&BET.data[m.gid].line)?'Spreads and totals use the usual -110 price; change it if your book shows something else. ':''}${m.gid?'This bet settles itself when the game ends.':'You mark this one won or lost yourself.'}</p>
    <div class="head-acts"><button class="btn pri" data-bm="track">Track this bet</button>${m.free?'':`<button class="btn sec" data-bm="leg">Add to parlay</button>`}<button class="btn sec" data-vmm="close">Cancel</button></div>`,{onclose:()=>{ BETM=null; }}); }
function betFromModal(){ const m=BETM, ch=(m.choices||[])[m.pick]||{}, odds=String(($('#bmOdds')||{}).value||'').trim(), stake=+(($('#bmStake')||{}).value||0), desc=String(($('#bmDesc')||{}).value||'').trim();
  if(!okOdds(odds)){ toast('Enter American odds like -110 or +150'); return null; }

function mmFrameCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; c.naturalWidth=w; c.naturalHeight=h; return c; }
function mmSetAnim(frames,name){ if(!frames.length) throw new Error('No frames'); MM.anim={frames,i:0,id:Math.random()}; MM.vid=null; MM.img=frames[0].c; MM.imgName=name||'meme';
  if(!MM.boxes.length) MM.boxes=[mmBox(0.1),mmBox(0.9)]; MM.sel=0; renderMemes(); mmAnimKick(); }
function mmAnimKick(){ const A=MM.anim; if(!A||A.run) return; A.run=true;
  const step=()=>{ if(MM.anim!==A){ A.run=false; return; } if(S.view!=='memes'){ A.run=false; return; } A.i=(A.i+1)%A.frames.length; if(!MM.drag){ MM.img=A.frames[A.i].c; mmDraw(); } setTimeout(step,A.frames[A.i].d); };
  setTimeout(step,A.frames[0].d); }
async function mmLoadGif(file){
  if(!('ImageDecoder' in window)){ const r=new FileReader(); r.onload=()=>mmUseData(r.result,file.name.replace(/\.[^.]+$/,''),2); r.readAsDataURL(file); return; }
  toast('Reading the GIF…');
  try{ const dec=new ImageDecoder({data:await file.arrayBuffer(),type:file.type||'image/gif'}); await dec.tracks.ready; await dec.completed;
    const n=Math.min(dec.tracks.selectedTrack.frameCount,240), frames=[]; let W=0,H=0,k=1;
    for(let i=0;i<n;i++){ const {image}=await dec.decode({frameIndex:i}); if(!W){ k=Math.min(1,640/Math.max(image.displayWidth,image.displayHeight)); W=Math.round(image.displayWidth*k); H=Math.round(image.displayHeight*k); }
      const c=mmFrameCanvas(W,H); c.getContext('2d').drawImage(image,0,0,W,H); frames.push({c,d:Math.max(20,Math.round((image.duration||100000)/1000))}); image.close(); }
    dec.close(); if(frames.length<2){ MM.anim=null; MM.img=frames[0].c; MM.imgName=file.name.replace(/\.[^.]+$/,''); if(!MM.boxes.length) MM.boxes=[mmBox(0.1),mmBox(0.9)]; renderMemes(); return; }
    mmSetAnim(frames,file.name.replace(/\.[^.]+$/,'')); }catch(e){ toast('Could not read that GIF: '+e.message); } }
function mmLoadVideo(url,name,start){ MM.anim=null; MM.vid={url,name:name||'clip',start:start||0,len:3,fps:12,dur:0}; MM.img=null; renderMemes(); }
const mmSeek=(v,t)=>new Promise(res=>{ const done=()=>{ v.removeEventListener('seeked',done); res(); }; v.addEventListener('seeked',done); v.currentTime=t; setTimeout(done,3000); });
async function mmCutVideo(){ const V=MM.vid; if(!V) return; const v=document.createElement('video'); v.muted=true; v.preload='auto'; v.src=V.url; v.playsInline=true;
  await new Promise((res,rej)=>{ v.onloadeddata=res; v.onerror=()=>rej(new Error('That video could not be opened')); });
  const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)), W=Math.round(v.videoWidth*k), H=Math.round(v.videoHeight*k), n=Math.max(2,Math.round(V.len*V.fps)), d=Math.round(1000/V.fps), frames=[];
  MM.cutting=0; for(let i=0;i<n;i++){ const t=Math.min(V.dur||v.duration,V.start+i/V.fps); await mmSeek(v,t); const c=mmFrameCanvas(W,H); c.getContext('2d').drawImage(v,0,0,W,H); frames.push({c,d}); MM.cutting=(i+1)/n; const p=$('#mmCutP'); if(p) p.textContent=Math.round(MM.cutting*100)+'%'; }
  v.removeAttribute('src'); v.load(); MM.cutting=null; const name=V.name; mmSetAnim(frames,name); }
function mmVidHtml(){ const V=MM.vid; return `<div class="mm-stage"><video id="mmVid" src="${esc(V.url)}" controls muted playsinline style="max-width:100%;max-height:52vh"></video></div>

async function mmGifBytes(){ await loadScript('gifenc.js','gifenc'); const {GIFEncoder,quantize,applyPalette}=window.gifenc, A=MM.anim, keep=MM.img;
  const L=mmLayout(), k=Math.min(1,480/L.W), W=Math.max(2,Math.round(L.W*k)), H=Math.max(2,Math.round(L.total*k)), enc=GIFEncoder(), full=document.createElement('canvas'), sm=document.createElement('canvas'); sm.width=W; sm.height=H; const g=sm.getContext('2d',{willReadFrequently:true});
  try{ for(let i=0;i<A.frames.length;i++){ MM.img=A.frames[i].c; mmDraw(full,true); g.clearRect(0,0,W,H); g.drawImage(full,0,0,W,H); const {data}=g.getImageData(0,0,W,H), pal=quantize(data,256,{format:'rgb565'}), idx=applyPalette(data,pal,'rgb565');
      enc.writeFrame(idx,W,H,{palette:pal,delay:A.frames[i].d}); if(i%4===3) await new Promise(r=>setTimeout(r)); } }

function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }

function sndNormGain(s){ if(!S.sndNorm||!s||!s.buf) return 1; if(s._ng) return s._ng; const b=s.buf, n=b.length, step=Math.max(1,Math.floor(n/400000)); let sum=0,cnt=0,peak=0;

function rpCfg(){ if(!S.replay) S.replay={}; return Object.assign(S.replay,Object.assign({on:false,len:30,q:'1080p30',game:true,voice:true},S.replay)); }
var RP=null;
async function rpPickVideo(W,H,fps,br){
  for(const [kind,codec] of [['avc','avc1.640033'],['avc','avc1.4d0033'],['avc','avc1.42e033'],['vp9','vp09.00.41.08']]) for(const hw of ['prefer-hardware','no-preference']){

    try{ const r=await VideoEncoder.isConfigSupported(cfg); if(r&&r.supported) return {kind,cfg}; }catch{} }

async function rpPickAudio(sr,ch){ for(const [kind,codec] of [['aac','mp4a.40.2'],['opus','opus']]){ const cfg={codec,sampleRate:sr,numberOfChannels:ch,bitrate:160000}; try{ const r=await AudioEncoder.isConfigSupported(cfg); if(r&&r.supported) return {kind,cfg}; }catch{} } return null; }

  if(kind==='v'&&ch.type==='key') rpTrim(R); }
function rpTrim(R){ const keep=(rpCfg().len+3)*1e6, now=performance.now()*1000; let i=0;
  for(let k=0;k<R.v.length;k++){ if(R.v[k].key&&R.v[k].ts<=now-keep) i=k; }
  if(i>0){ for(let k=0;k<i;k++) R.bytes-=R.v[k].data.byteLength; R.v.splice(0,i); }
  const t0=R.v.length?R.v[0].ts:now; let j=0; while(j<R.a.length&&R.a[j].ts<t0-5e5){ R.bytes-=R.a[j].data.byteLength; j++; } if(j) R.a.splice(0,j); }
async function rpPumpVideo(R,vt){ const rd=new MediaStreamTrackProcessor({track:vt}).readable.getReader(); R.vrd=rd; let cv=null,cg=null;
  for(;;){ let r; try{ r=await rd.read(); }catch{ break; } if(r.done||RP!==R){ if(r.value) r.value.close(); break; } let f=r.value;
    if(R.offV==null) R.offV=performance.now()*1000-f.timestamp;
    if(!R.venc||R.venc.state!=='configured'||R.venc.encodeQueueSize>3){ f.close(); continue; }
    if(f.displayWidth!==R.W||f.displayHeight!==R.H){ if(!cv){ cv=new OffscreenCanvas(R.W,R.H); cg=cv.getContext('2d'); } cg.drawImage(f,0,0,R.W,R.H); const nf=new VideoFrame(cv,{timestamp:f.timestamp}); f.close(); f=nf; }
    const key=f.timestamp-R.lastKey>=2e6; if(key) R.lastKey=f.timestamp;
    try{ R.venc.encode(f,{keyFrame:key}); }catch(e){ f.close(); rpFail(R,e); break; } f.close(); } }
async function rpPumpAudio(R,at){ const rd=new MediaStreamTrackProcessor({track:at}).readable.getReader(); R.ard=rd;
  for(;;){ let r; try{ r=await rd.read(); }catch{ break; } if(r.done||RP!==R){ if(r.value) r.value.close(); break; } const d=r.value, now=performance.now()*1000;
    if(R.offA==null) R.offA=now-d.timestamp;
    else { R.drift.push(now-(d.timestamp+R.offA)); if(R.drift.length>=300){ const avg=R.drift.reduce((a,b)=>a+b,0)/R.drift.length; R.drift=[]; if(Math.abs(avg)>40e3) R.offA+=avg; } }
    if(!R.aenc||R.aenc.state!=='configured'||R.aenc.encodeQueueSize>30){ d.close(); continue; }
    try{ R.aenc.encode(d); }catch(e){ d.close(); break; } d.close(); } }
async function rpStart(){

  const c=rpCfg(), q=REC_Q[c.q]||REC_Q['1080p30'], R={starting:true,v:[],a:[],bytes:0,drift:[],lastKey:-1e15,offV:null,offA:null,stopAfter:[],nodes:[]}; RP=R; rpUi();

    if(!capSources) await capLoadSources(true);
    const src=((capSources||[]).find(x=>x.id===capCfg().src)||(capSources||[]).find(x=>x.screen)||(capSources||[])[0]||{}).id; if(!src) throw new Error('No screen was found to record');

    let desk; try{ desk=await navigator.mediaDevices.getUserMedia({video,audio:c.game?{mandatory:{chromeMediaSource:'desktop'}}:false}); }catch(e){ if(!c.game) throw e; desk=await navigator.mediaDevices.getUserMedia({video,audio:false}); }

    if(c.voice){ let tap=N.master; if(gt&&split()) tap=S.hear?null:N.voiceMix; if(tap){ const g=ctx.createGain(); tap.connect(g); g.connect(dest); R.nodes.push(g); R.tap=tap; R.tapG=g; audio=true; } }
    const at=audio?dest.stream.getAudioTracks()[0]:null, ap=at?await rpPickAudio(ctx.sampleRate,2):null;
    R.vk=vp.kind; R.ak=ap&&ap.kind; R.aSr=ctx.sampleRate; R.t0=Date.now(); R.starting=false;
    R.venc=new VideoEncoder({output:(ch,meta)=>rpPush(R,'v',ch,meta),error:e=>rpFail(R,e)}); R.venc.configure(vp.cfg);
    if(ap){ R.aenc=new AudioEncoder({output:(ch,meta)=>rpPush(R,'a',ch,meta),error:e=>rpFail(R,e)}); R.aenc.configure(ap.cfg); }
    rpPumpVideo(R,vt); if(ap) rpPumpAudio(R,at);
    vt.addEventListener('ended',()=>{ if(RP===R){ rpStop(true); if(rpCfg().on) setTimeout(rpStart,3000); } });

}
function rpStop(quiet){ const R=RP; if(!R) return; RP=null;
  try{ R.vrd&&R.vrd.cancel(); }catch{} try{ R.ard&&R.ard.cancel(); }catch{}
  try{ if(R.venc&&R.venc.state!=='closed') R.venc.close(); }catch{} try{ if(R.aenc&&R.aenc.state!=='closed') R.aenc.close(); }catch{}
  for(const st of R.stopAfter||[]) st.getTracks().forEach(t=>t.stop());
  if(R.tap&&R.tapG){ try{ R.tap.disconnect(R.tapG); }catch{} } for(const n of R.nodes||[]){ try{ n.disconnect(); }catch{} }
  R.v=[]; R.a=[]; if(!quiet) toast('Instant replay is off'); rpUi(); pushOverlay(); }
function rpFail(R,e){ if(RP!==R) return; errLog('replay',e); rpStop(true); toast('Instant replay stopped: '+(e&&e.message||e)+'. Trying again in 10 seconds.'); setTimeout(()=>{ if(rpCfg().on&&!RP) rpStart(); },10000); }
function rpRestart(){ if(!RP) return; rpStop(true); setTimeout(()=>{ if(rpCfg().on) rpStart(); },800); }
async function rpSave(){ const R=RP;
  if(!R||R.starting){ toast(rpCfg().on?'Instant replay is still starting':'Instant replay is off. Turn it on in Record.'); return; }
  if(R.saving) return; R.saving=true;
  try{ await loadScript('mp4-muxer.js','Mp4Muxer');
    const now=performance.now()*1000, len=rpCfg().len*1e6, V=R.v.slice(), A=R.a.slice();
    let i=-1; for(let k=0;k<V.length;k++){ if(V[k].key&&V[k].ts<=now-len) i=k; } if(i<0) i=V.findIndex(x=>x.key);
    if(i<0||!R.vmeta) throw new Error('nothing has been captured yet');
    const vs=V.slice(i), t0=vs[0].ts, as=R.ameta?A.filter(x=>x.ts>=t0):[];
    const dc=R.ameta&&R.ameta.decoderConfig||{};
    const mux=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:R.vk,width:R.W,height:R.H,frameRate:R.fps},audio:as.length?{codec:R.ak,sampleRate:dc.sampleRate||R.aSr,numberOfChannels:dc.numberOfChannels||2}:undefined,fastStart:'in-memory',firstTimestampBehavior:'cross-track-offset'});

  const toPx=e=>{ const r=cv.getBoundingClientRect(), z=chCfg().zoom; return {x:(e.clientX-r.left-r.width/2)/z,y:(e.clientY-r.top-r.height/2)/z}; };
  cv.onpointerdown=e=>{ const p=toPx(e), d=XH.draft; let hit=-1; for(let i=d.layers.length-1;i>=0;i--){ const L=d.layers[i]; if(L.hidden) continue; const b=CrosshairDraw.bounds(d,i); if(p.x>=b.x0-2&&p.x<=b.x1+2&&p.y>=b.y0-2&&p.y<=b.y1+2){ hit=i; break; } }
    if(hit<0) hit=XD.sel; if(hit!==XD.sel){ XD.sel=hit; xdRefresh(true); } const L=xdL(); if(!L) return; xdSnap(true); XD.drag={sx:p.x,sy:p.y,ox:L.x,oy:L.y}; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove=e=>{ if(!XD.drag) return; const p=toPx(e), L=xdL(); L.x=Math.round(XD.drag.ox+p.x-XD.drag.sx); L.y=Math.round(XD.drag.oy+p.y-XD.drag.sy); xdPaint(); xdSyncPos(); };
  cv.onpointerup=()=>{ XD.drag=null; };
  cv.onwheel=e=>{ e.preventDefault(); xdZoom(e.deltaY<0?1:-1); }; }
function xdZoom(dir){ const c=chCfg(), Z=[1,2,3,4,6,8,12,16]; let i=Z.indexOf(c.zoom); if(i<0) i=3; c.zoom=Z[Math.max(0,Math.min(Z.length-1,i+dir))]; save(); const b=document.querySelector('.xd-zoom b'); if(b) b.textContent=c.zoom+'×'; xdPaint(); }
function xdSyncPos(){ for(const k of ['x','y']){ const el=document.querySelector(`#xdProps [data-lp="${k}"]`); if(el&&document.activeElement!==el) el.value=xdL()[k]; } }
function xdRefresh(props){ const l=$('#xdLayers'); if(l) l.innerHTML=xdLayersHtml(); if(props){ const p=$('#xdProps'); if(p) p.innerHTML=xdPropsHtml(); } const u=document.querySelector('[data-xdact="undo"]'); if(u) u.disabled=!XD.hist.length; const r=document.querySelector('[data-xdact="redo"]'); if(r) r.disabled=!XD.fut.length; xdPaint(); }
function xdAddImage(L){ const i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=()=>{ const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,256/Math.max(im.width,im.height)), cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(im.width*s)); cv.height=Math.max(1,Math.round(im.height*s)); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    const src=cv.toDataURL('image/png'), w=32, h=Math.max(2,Math.round(32*im.height/im.width)); xdSnap(true); if(L){ L.src=src; } else { XH.draft.layers.push(CrosshairDraw.layer({type:'image',name:f.name.replace(/\.[^.]+$/,'').slice(0,24)||'Image',src,w,h})); XD.sel=XH.draft.layers.length-1; } XD.addOpen=false; xdRefresh(true); }; im.src=r.result; }; r.readAsDataURL(f); }; i.click(); }
$('#view-crosshair').addEventListener('click',e=>{ if(!XH.draft) return; const t=e.target, d=XH.draft;
  const sel=t.closest('[data-xdsel]'); if(sel&&!t.closest('[data-xdl]')){ XD.sel=+sel.dataset.xdsel; xdRefresh(true); return; }
  const la=t.closest('[data-xdl]'); if(la){ const [op,is]=la.dataset.xdl.split(':'), i=+is; xdSnap(true);
    if(op==='hide') d.layers[i].hidden=!d.layers[i].hidden;
    if(op==='up'&&i<d.layers.length-1){ [d.layers[i],d.layers[i+1]]=[d.layers[i+1],d.layers[i]]; if(XD.sel===i) XD.sel=i+1; else if(XD.sel===i+1) XD.sel=i; }
    if(op==='down'&&i>0){ [d.layers[i],d.layers[i-1]]=[d.layers[i-1],d.layers[i]]; if(XD.sel===i) XD.sel=i-1; else if(XD.sel===i-1) XD.sel=i; }
    xdRefresh(true); return; }
  const ad=t.closest('[data-xdadd]'); if(ad){ const k=ad.dataset.xdadd; if(k==='menu'){ XD.addOpen=true; xdRefresh(false); return; }
    if(k==='image'){ xdAddImage(null); return; } xdSnap(true); const n=d.layers.length+1;
    const L=k==='text'?CrosshairDraw.layer({type:'text',name:'Text '+n,y:-20}):k==='ring'?CrosshairDraw.layer({name:'Circle '+n,shape:'circle',gap:12,len:2,thick:1}):k==='dot'?CrosshairDraw.layer({name:'Dot '+n,shape:'dot',dotSize:2}):CrosshairDraw.layer({name:'Crosshair '+n});
    d.layers.push(L); XD.sel=d.layers.length-1; XD.addOpen=false; xdRefresh(true); return; }
  const sd=t.closest('[data-xdside]'); if(sd){ XD.side=sd.dataset.xdside; xdRefresh(true); return; }
  const sc=t.closest('[data-xdsec]'); if(sc){ const k='c'+sc.dataset.xdsec; XD[k]=!XD[k]; xdRefresh(true); return; }
  const tg=t.closest('[data-xdtog]'); if(tg){ xdSnap(true); const L=xdL(), k=tg.dataset.xdtog; L[k]=!L[k]; if(k==='dot'&&L.dot&&!L.dotColor) L.dotColor=L.color; xdRefresh(true); return; }
  const sw=t.closest('[data-xdsw]'); if(sw){ xdSnap(true); xdL().color=sw.dataset.xdsw; xdRefresh(true); return; }
  const im=t.closest('[data-xdimg]'); if(im){ xdAddImage(xdL()); return; }
  const z=t.closest('[data-xdzoom]'); if(z){ xdZoom(+z.dataset.xdzoom); return; }
  const a=t.closest('[data-xdact]'); if(a){ const k=a.dataset.xdact;
    if(k==='undo') xdUndo(false); else if(k==='redo') xdUndo(true);
    else if(k==='dup'){ xdSnap(true); const L=JSON.parse(JSON.stringify(xdL())); L.name=L.name+' copy'; d.layers.splice(XD.sel+1,0,L); XD.sel++; xdRefresh(true); }
    else if(k==='del'&&d.layers.length>1){ xdSnap(true); d.layers.splice(XD.sel,1); XD.sel=Math.max(0,XD.sel-1); xdRefresh(true); } return; }
});
$('#view-crosshair').addEventListener('input',e=>{ if(!XH.draft) return; const t=e.target;
  if(t.dataset.xdname!=null){ XH.draft.name=t.value; return; }
  const L=xdL(); if(!L) return;
  if(t.dataset.lphex){ const v=t.value.trim(); if(/^#?[0-9a-f]{6}$/i.test(v)){ xdSnap(); L[t.dataset.lphex]=(v[0]==='#'?v:'#'+v).toLowerCase(); const c=t.parentNode.querySelector('input[type=color]'); if(c) c.value=L[t.dataset.lphex]; xdPaint(); } return; }
  if(t.dataset.lpck){ xdSnap(); if(t.dataset.lpck==='weight') L.weight=t.checked?800:500; else if(t.dataset.lpck==='dotStyle') L.dotStyle=t.checked?'circle':'square'; xdPaint(); return; }
  const k=t.dataset.lp; if(!k) return; xdSnap();
  if(t.type==='number'){ let v=parseFloat(t.value); if(isNaN(v)) return; if(t.dataset.pct||(k==='opacity'&&L.type==='image')) v=Math.max(0,Math.min(100,v))/100; L[k]=v; }
  else if(t.type==='color'){ L[k]=t.value; const h=t.parentNode.querySelector('[data-lphex]'); if(h) h.value=t.value.toUpperCase(); }
  else { L[k]=t.value; if(k==='name'){ const l=$('#xdLayers'); if(l) l.innerHTML=xdLayersHtml(); } }

$('#view-crosshair').addEventListener('change',e=>{ if(!XH.draft) return; const k=e.target.dataset&&e.target.dataset.lp; if(k==='shape'||k==='anim'||k==='dotStyle') xdRefresh(true); });
document.addEventListener('keydown',e=>{ if(S.view!=='crosshair'||chCfg().tab!=='edit'||!XH.draft) return; const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName);
  if((e.ctrlKey||e.metaKey)&&!typing&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); xdUndo(e.shiftKey); return; }
  if((e.ctrlKey||e.metaKey)&&!typing&&(e.key==='y'||e.key==='Y')){ e.preventDefault(); xdUndo(true); return; }
  if(typing) return; const L=xdL(); if(!L) return; const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){ e.preventDefault(); xdSnap(); L.x+=m[0]*(e.shiftKey?5:1); L.y+=m[1]*(e.shiftKey?5:1); xdPaint(); xdSyncPos(); }
  if(e.key==='Delete'&&XH.draft.layers.length>1){ xdSnap(true); XH.draft.layers.splice(XD.sel,1); XD.sel=Math.max(0,XD.sel-1); xdRefresh(true); } });

function chGameFor(exe){ exe=String(exe||'').toLowerCase(); return CH_GAMES.find(g=>g.exe.some(x=>x.toLowerCase()===exe))||null; }
function chGameName(r){ const g=chGameFor(r&&r.exe); return g?g.name:(r&&(r.title||r.exe)||'your game'); }
function chProblems(r){ if(!r||r.error||r.unsupported||r.self||!r.on) return null; const p=[];
  if(r.exclusive) p.push('exclusive'); if(r.fsoOff) p.push('fso'); if(r.wrongScreen) p.push('screen'); return p; }
function chWarn(){ const l=chCfg().lastCheck; return l&&l.problems&&l.problems.length?l:null; }
/* run the check; tell the person if something is wrong */
async function chRunCheck(why,delay){ if(!APP||!APP.more) return null; if(XH.checking) return null; XH.checking=true; let r=null;
  try{ r=await mcall({op:'crosshairCheck',delay:delay||0}); }catch(e){ r={error:e.message}; } XH.checking=false; XH.last=r;
  const probs=chProblems(r), c=chCfg();
  if(probs){ c.lastCheck={at:Date.now(),exe:r.exe,title:r.title,game:chGameName(r),problems:probs,gameScreen:r.gameScreen}; save();
    if(probs.length&&why!=='helper'){ const key=r.exe+':'+probs.join(','); XH.told=XH.told||{}; if(!XH.told[key]){ XH.told[key]=1;
      notify('Crosshair can\'t show over '+chGameName(r), probs.includes('exclusive')?'The game is in exclusive fullscreen. Open VanMule for the 1-minute fix.':probs.includes('screen')?'The crosshair is on a different screen than your game.':'Fullscreen optimizations are turned off for this game.'); } } }
  try{ renderTitlebar(); }catch{} if(S.view==='crosshair') try{ renderCrosshair(); }catch{}
  return r; }
/* called whenever the crosshair turns on */
function chAfterOn(){ const c=chCfg(); clearTimeout(XH.ckT1); clearTimeout(XH.ckT2);
  if(!document.hasFocus()){ XH.ckT1=setTimeout(()=>{ if(chCfg().on) chRunCheck('hotkey'); },2500); return; }  // turned on from a hotkey while in a game
  if(!c.helped){ c.helped=true; save(); setTimeout(()=>chHelp('start'),600); return; }
  const later=()=>{ if(chCfg().on&&!document.hasFocus()) chRunCheck('auto'); };
  XH.ckT1=setTimeout(later,45e3); XH.ckT2=setTimeout(later,180e3); }
/* while it's on and you're in another window, look every 5 minutes */
vmJob('chcheck',10*60e3,5*60e3,'crosshair',()=>{ if(!APP||!APP.more||!S.ch||!S.ch.on||document.hasFocus()) return; if(XH.last&&!XH.last.error&&XH.lastAt&&Date.now()-XH.lastAt<30*60e3) return; XH.lastAt=Date.now(); return chRunCheck('auto'); });

/* ---------- the helper pop-up ---------- */
function chhCard(title,body,acts){ return `<div class="row-between"><h2 style="margin:0">${title}</h2><button class="ib" data-vmm="close" aria-label="Close">${ico('x')}</button></div><div class="chh">${body}</div>${acts?`<div class="head-acts chh-acts">${acts}</div>`:''}`; }
function chhSteps(g){ return `<ol class="chh-steps">${g.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`; }
async function chHelp(step,arg){ await loadScript('crosshair-draw.js','CrosshairDraw').catch(()=>{}); const c=chCfg(), a=chActive(); let h='';
  switch(step){
  case 'start':
    if(!a){ const f=c.list.find(x=>x.fav)||c.list[0]; if(f){ c.active=f.id; save(); } }
    if(!c.on){ c.on=true; XH.hint=false; save(); chPush(); try{ renderTitlebar(); }catch{} }
    h=chhCard('Crosshair helper',`<p>Your crosshair <b>${esc((chActive()||{}).name||'')}</b> is on. Look at the <b>middle of your screen</b>${(XH.disp||[]).length>1?' (the one picked under Screen)':''}.</p><p class="big">Can you see it on top of this window?</p>`,

  case 'desk-no': { let disp=[]; try{ disp=await mcall({op:'displays'}); }catch{} XH.disp=disp;
    h=chhCard("Let's make it show up",`<p>Try these one at a time. After each one, look at the middle of the screen again.</p>
      <div class="chh-fix"><div><b>1. Make it big and bright</b><p class="note">Switches to a thick green cross in the exact center, in case yours is small, faint or nudged off-center.</p></div><button class="btn small sec" data-chh="bright">Do it</button></div>
      ${disp.length>1?`<div class="chh-fix"><div><b>2. Pick the right screen</b><p class="note">You have ${disp.length} screens. It's showing on: ${esc((disp.find(d=>String(c.display)===d.id)||disp.find(d=>d.primary)||{}).label||'main screen')}.</p></div><select class="sel" id="chhDisp" style="width:auto">${disp.map(d=>`<option value="${esc(d.id)}" ${String(c.display)===d.id||(!c.display&&d.primary)?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div>`:''}
      <div class="chh-fix"><div><b>${disp.length>1?3:2}. Restart the crosshair</b><p class="note">Closes and reopens the see-through window.</p></div><button class="btn small sec" data-chh="restart">Restart it</button></div>
      <div class="chh-fix"><div><b>${disp.length>1?4:3}. Use "Stay on top harder"</b><p class="note">Pushes it back on top twice a second if something covers it.</p></div><button class="btn small sec" data-chh="strong">${c.method==='strong'?'On ✓':'Turn on'}</button></div>`,
      `<button class="btn pri" data-chh="desk-yes">I see it now</button><button class="btn sec" data-chh="desk-stuck">Still nothing</button>`); break; }

      <li>Close other overlay or screen-dimming apps (other crosshair apps, f.lux, some RGB or monitor tools) and click <b>Restart it</b> again.</li>
      <li>Restart VanMule. The crosshair window is created fresh each time.</li>
      <li>If you use a TV or projector as a second screen, unplug it or pick your main screen.</li>
      <li>Still stuck? Settings → Help → copy the error log and send it to us; it includes what the crosshair window reported.</li></ul>`,
      `<button class="btn sec" data-chh="desk-no">Back</button><button class="btn pri" data-vmm="close">Close</button>`); break;
  case 'desk-yes': case 'games':
    h=chhCard(step==='desk-yes'?'It works. Now set up your game':'Set up your game',`<p>Most games are fine, but a game in <b>exclusive fullscreen</b> covers every other window, including the crosshair. Switching to <b>borderless</b> or <b>windowed fullscreen</b> fixes it, looks the same, and usually alt-tabs faster.</p>
      <p><b>Which game do you play?</b></p><div class="chh-games">${CH_GAMES.map(g=>`<button class="chh-game" data-chh="game:${g.id}">${esc(g.name)}</button>`).join('')}</div>`,

  case 'game': { const g=CH_GAMES.find(x=>x.id===arg)||CH_GAMES[CH_GAMES.length-1];
    h=chhCard(esc(g.name),`<p>In ${esc(g.name==='Another game'?'your game':g.name)}:</p>${chhSteps(g)}<p class="note">Menu names can change a little between game updates.</p><p>Then start a match and look for your crosshair. Not sure it worked? Let VanMule check.</p>`,
      `<button class="btn sec" data-chh="games">Back</button><button class="btn sec" data-chh="auto">Check my game</button><button class="btn pri" data-vmm="close">It works</button>`); break; }

    return;
  case 'result': { const r=arg||XH.last||{}, probs=chProblems(r)||[], g=chGameFor(r.exe);

function toAcc(c){
  const map={Minus:'-',Equal:'=',BracketLeft:'[',BracketRight:']',Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Backslash:'\\',Backquote:'`',ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',Escape:'Esc',Meta:'Super','Num Add':'numadd','Num Subtract':'numsub','Num Multiply':'nummult','Num Divide':'numdiv','Num Decimal':'numdec','Num Enter':'Enter'};
  const parts=[]; const raw=c.split('+'); for(let i=0;i<raw.length;i++){ let p=raw[i]; if(p==='Num '&&raw[i+1]!==undefined){ p='Num Add'; i++; } const m=/^Num (\d)$/.exec(p); parts.push(map[p]||(m?'num'+m[1]:p)); }
  return parts.join('+');
}

    case 'restart': h+=`<h2>Restart to finish</h2><p class="note">The virtual microphone is installed, but Windows needs a restart before it appears. Open VanMule after restarting and setup continues where it left off.</p><div class="head-acts"><button class="btn pri" data-wiz="reboot">Restart now</button><button class="btn sec" data-wiz="later">Restart later</button></div>`; break;
    case 'mic': { const mics=devices.in.filter(d=>d.deviceId&&d.deviceId!=='default'&&d.deviceId!=='communications'&&!/cable|vb-audio|voicemeeter/i.test(d.label));
      h+=`<h2>Pick your microphone</h2><p class="note">This is the real mic you talk into. Say something and watch the bar move.</p><select class="sel" id="wizMic" aria-label="Microphone">${mics.map(d=>`<option value="${esc(d.deviceId)}" ${d.deviceId===S.devIn?'selected':''}>${esc(d.label||'Microphone')}</option>`).join('')||'<option value="">No microphone found</option>'}</select><div class="meter" id="mWiz">${'<i></i>'.repeat(48)}</div><div class="head-acts"><button class="btn pri" data-wiz="connect">Next</button><button class="btn sec" data-wiz="skip">Skip</button></div>`; break; }
    case 'connecting': h+=`<h2>Connecting to Discord</h2><div class="wizrow"><div class="spin"></div><p class="note">Routing your voice into the virtual microphone…</p></div>`; break;
    case 'done': h+=`<h2>You're all set</h2>${(wiz.msgs||[]).map(([k,m])=>`<div class="checkline"><span class="mk ${k}">${k==='ok'?'✓':'!'}</span><span>${esc(m)}</span></div>`).join('')}
      <div class="plabel">One time in Discord</div><ol class="note" style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Open <b>User Settings → Voice &amp; Video</b>.</li><li>Leave <b>Input Device</b> on <b>Default</b>, or pick <b>CABLE Output</b>.</li><li>Set <b>Noise Suppression</b> to <b>None</b>. Discord's noise filter removes voice effects.</li><li>Turn off <b>Echo Cancellation</b> and <b>Automatic Gain Control</b>.</li></ol>
      <p class="note">Closing the window keeps VanMule running in the tray. When you quit it, your real mic becomes the Windows default again.</p><div class="head-acts"><button class="btn pri" data-wiz="finish">Finish</button></div>`; break;
  }
  $('#wizcard').innerHTML=h;
  const wm=$('#wizMic'); if(wm) wm.onchange=async e=>{ S.devIn=e.target.value; save(); await startMic(); };
}
$('#wiz').addEventListener('click',e=>{ const b=e.target.closest('[data-wiz]'); if(!b) return; const a=b.dataset.wiz;
  if(a==='check') wizCheck(); else if(a==='install') wizInstall(); else if(a==='connect') wizConnect();
  else if(a==='skip'||a==='finish') closeWizard(true); else if(a==='later') closeWizard(false); else if(a==='reboot') APP.restartPC(); });
if(APP){
  document.body.classList.add('is-app');
  APP.onShortcut(d=>fireShortcut(d.kind,d.id));
  APP.onTray(a=>{ a=String(a); if(a.startsWith('voice:')) selectVoice(a.slice(6)); else if(a.startsWith('view:')) setView(a.slice(5)); else if(a==='liteToggle') liteToggle(); else runAction(a); setTimeout(()=>{ try{ trayPushState(true); }catch{} },120); });
  if(APP.overlay){ APP.overlay.onCmd(onOverlayCmd); APP.overlay.onState(on=>{ ovOpen=on; if(on){ pushOverlay(); if(Date.now()-OVQ.at>60e3) ovMemesLoad(); } }); }
  APP.getConfig().then(c=>{ appCfg=c; if(S.view==='settings') renderSettings(); }).catch(()=>{});
  refreshAppStatus();
}

listDevices().then(()=>{ if(S.view==='settings') renderSettings(); });
renderAll(); loadMySounds(); requestAnimationFrame(meterLoop);
if(APP){ if(!S.appSetupDone||S.wizResume) openWizard(S.wizResume?'check':'welcome'); else startMic(); }
</script>
